<!doctype html><html><head><meta charset="utf-8"><title>Telar card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Geist:wght@500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#0E0D0B;padding:40px;display:flex;flex-direction:column;gap:48px;align-items:flex-start;font-family:Geist,sans-serif}
.wrap{width:520px}
#full{height:328px}
#strip{height:80px;overflow:hidden;border-radius:19px 19px 0 0}
.pass{position:relative;width:520px;height:328px;border-radius:19px;color:#FBEBDD;--c:#6C2822;text-align:left}
.pass::after{content:"";position:absolute;inset:10% 6% -6%;border-radius:inherit;background:rgba(0,0,0,.55);filter:blur(22px);z-index:-1}
#strip .pass::after{display:none}
.card{position:absolute;inset:0;border-radius:inherit;overflow:hidden;contain:paint;padding:24px 28px 22px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr auto auto;background:#6C2822;color:#FBEBDD;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(0,0,0,.08),0 -10px 22px -6px rgba(0,0,0,.42),0 -1px 0 rgba(0,0,0,.25)}
.card>*{position:relative}
.art{position:absolute!important;inset:0;width:100%;height:100%;border-radius:inherit;overflow:hidden}
.tex{position:absolute!important;inset:0;opacity:0.12;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22220%22%20height%3D%22220%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%22.9%22%20numOctaves%3D%223%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20values%3D%220%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%200%200%20.55%200%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url(%23n)%22%2F%3E%3C%2Fsvg%3E");background-size:220px}
.title{grid-column:1;display:flex;flex-direction:column;gap:6px}
.name{font:700 23px/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.topic{font:600 10px/1 Geist,sans-serif;letter-spacing:.2em;text-transform:uppercase;opacity:.78}
.nfc{grid-column:2;width:26px;height:26px;opacity:.8}
svg.chip{grid-column:1;margin-top:22px;width:52px;height:40px}
.num{grid-column:1/3;align-self:end;margin-bottom:14px;font:500 21px/1 "Geist Mono",monospace;letter-spacing:.16em;text-shadow:0 1px 0 rgba(0,0,0,.28)}
.bottom{grid-column:1/3;display:flex;align-items:flex-end;gap:30px}
.field{display:flex;flex-direction:column;gap:5px}
.lab{font:600 8.5px/1 Geist,sans-serif;letter-spacing:.2em;opacity:.72}
.val{font:600 13px/1 Geist,sans-serif;letter-spacing:.14em}
.mark{margin-left:auto;width:54px;height:38px;flex:none}
