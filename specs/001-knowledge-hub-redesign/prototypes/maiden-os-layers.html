  /* Layout: one pinned stage; the app sits in 3D on the right, one caption at a time on the left. */
  :root {

  .piece { font-family: var(--ui); color: var(--app-ink); }
  .window { --bg: var(--app-bg); --edge: #C9C7D3; --r: 22px; }
  .dots { display: flex; gap: 9px; } .dots i { width: 13px; height: 13px; border-radius: 50%; background: #DCDAE3; }

  .chip b { display: block; font: 600 16px/1.15 var(--ui); } .chip span { font: 400 12.5px var(--ui); color: var(--app-2); display: flex; align-items: center; gap: 5px; } .chip span i { width: 7px; height: 7px; border-radius: 50%; background: #3B9BF0; }
  .round { --bg: #E9E6F6; --edge: #C9C3E4; --r: 999px; width: 46px; height: 46px; display: grid; place-items: center; color: var(--app-ink); }
  .round svg, .cta svg { width: 19px; height: 19px; }
  .cta { --bg: var(--violet); --edge: #4A32B8; --r: 999px; height: 46px; padding: 0 16px; display: flex; align-items: center; gap: 9px; font: 600 15px var(--ui); color: #fff; white-space: nowrap; }
  .cta u { text-decoration: none; background: rgba(255,255,255,.28); border-radius: 999px; min-width: 22px; height: 22px; display: grid; place-items: center; font-size: 12.5px; }
  .card { --r: 18px; padding: 16px 18px; }
  .audio { --bg: #FBE9EE; --edge: #E3BFCB; } .audio b, .guide b { display: block; font: 600 15.5px var(--ui); margin-bottom: 12px; }
  .audio .play { display: flex; align-items: center; gap: 12px; font: 600 12.5px var(--ui); color: #D6336C; }
  .audio .play i { width: 42px; height: 42px; border-radius: 50%; background: #F0528B; display: grid; place-items: center; }
  .audio .play i::after { content: ""; border: 8px solid transparent; border-left: 12px solid #fff; margin-left: 9px; }
  .wave { display: flex; align-items: center; gap: 3px; } .wave s { width: 3px; border-radius: 2px; background: #F0528B; }
  .guide { --bg: #E4F1F8; --edge: #B9D3E1; } .guide b { margin-bottom: 4px; } .guide p { font: 400 13px/1.45 var(--ui); color: var(--app-2); margin: 0 0 12px; }
  .guide .foot, .table .foot { display: flex; align-items: center; gap: 12px; font: 600 12.5px var(--ui); color: #1D6F9C; }
  .mini { height: 30px; padding: 0 13px; border-radius: 999px; display: inline-flex; align-items: center; font: 600 13.5px var(--ui); background: #2FA8E0; color: #fff; }
  .mini.ghost { background: #D5E6EF; color: #1D6F9C; }
  .bubble { --r: 22px; padding: 13px 20px; font: 400 17px/1.5 var(--ui); }
  .bubble.me { --bg: var(--violet); --edge: #4A32B8; color: #fff; white-space: nowrap; }
  .bubble.her { --bg: #E6E5EB; --edge: #C6C4CE; } .bubble p { margin: 0; } .bubble p + p { margin-top: 1.2em; }
  .table { --bg: #E8EEF2; --edge: #B9CBD6; box-shadow: inset 0 0 0 1.5px #C6DDE9; }
  .table b { display: block; font: 600 15px var(--ui); margin-bottom: 10px; }
  .table .tr { display: flex; gap: 14px; padding: 8px 8px; font: 400 12.5px/1.4 var(--ui); } .table .tr span:first-child { flex: none; width: 128px; }
  .table .tr.th { background: #D3E6F0; border-radius: 8px; font-weight: 600; color: #145A82; } .table .tr:nth-child(odd):not(.th) { background: rgba(255,255,255,.5); border-radius: 8px; }
  .table .foot { margin-top: 12px; }
  .field { --bg: #fff; --edge: #CFCDD8; --r: 999px; height: 50px; padding: 0 20px; display: flex; align-items: center; font: 400 16px var(--ui); color: #9A98A6; box-shadow: inset 0 0 0 1.5px #E2E0EA; }
  .round.plain { --bg: #fff; --edge: #CFCDD8; box-shadow: inset 0 0 0 1.5px #E2E0EA; }

  .greet { display: flex; gap: 12px; } .greet b { display: block; font: 600 17px var(--ui); margin-bottom: 3px; } .greet p { margin: 0; font: 400 13.5px/1.4 var(--ui); color: var(--app-2); }
  .pc { --r: 20px; padding: 15px 16px; }

  .pc h3 u { text-decoration: none; font-size: 12px; background: rgba(255,255,255,.6); border-radius: 999px; min-width: 22px; height: 20px; display: grid; place-items: center; }
  .pc .it { display: flex; gap: 10px; margin-top: 11px; font: 500 14px/1.3 var(--ui); }
  .pc .it::before { content: ""; width: 15px; height: 15px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(28,27,34,.45); flex: none; margin-top: 2px; }
  .pc .it.bare::before { display: none; }
  .pc .it small { display: block; font: 400 12px var(--ui); color: var(--app-2); margin-top: 2px; }
  .pc .it em { margin-left: auto; font: 600 12px var(--ui); font-style: normal; color: #D9363E; white-space: nowrap; }
  .pc.wait { --bg: #D8D1F6; --edge: #B4A9E4; --dot: #6A4DF0; color: #3B2A9B; } .pc.remind { --bg: #F0E3C8; --edge: #D3C29C; --dot: #E8A53A; }
  .pc.tasks { --bg: #DADCEC; --edge: #B7BAD0; --dot: #4C63D2; } .pc.day { --bg: #F3D6DA; --edge: #D9B2B8; --dot: #EE5C6C; } .pc.file { --bg: #CFE3EA; --edge: #A9C6D0; --dot: #2E97B8; }
</style>

(() => {
  const A = CONTENT.app, { esc } = Layers;
  const ICON = {

    list: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="6" r="1.8"/><circle cx="5" cy="14" r="1.8"/><path d="M10 6h7M10 14h7"/></svg>',

    mic: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="7.6" y="2.6" width="4.8" height="9.4" rx="2.4" fill="currentColor"/><path d="M4.8 10a5.2 5.2 0 0010.4 0M10 15.4v2.2"/></svg>'
  };
  const wave = [8, 16, 22, 12, 18, 26, 14, 20, 10, 24, 16, 12, 20, 8].map(h => `<s style="height:${h}px"></s>`).join("");

  const M = Layers.create({
    captions: [
      Object.assign({ show: [[-1, 0.12], [0.93, 2]] }, CONTENT.captions[0]),
      Object.assign({ show: [[0.27, 0.42]] }, CONTENT.captions[1]),
      Object.assign({ show: [[0.46, 0.66]] }, CONTENT.captions[2]),
      Object.assign({ show: [[0.70, 0.89]] }, CONTENT.captions[3])
    ],
    // Camera stops: scroll position, tilt, turn, zoom, and the point of the app it looks at.
    cam: [
      { p: 0.00, rx: 16, rz: 0,   s: 1.00, fx: 0,    fy: 0 },
      { p: 0.08, rx: 16, rz: 0,   s: 1.00, fx: 0,    fy: 0 },
      { p: 0.28, rx: 56, rz: -36, s: 0.66, fx: 0,    fy: 0 },
      { p: 0.40, rx: 50, rz: -28, s: 0.76, fx: -120, fy: -20 },
      { p: 0.52, rx: 50, rz: -28, s: 0.78, fx: -180, fy: 60 },
      { p: 0.64, rx: 50, rz: -30, s: 0.78, fx: -200, fy: 120 },
      { p: 0.74, rx: 50, rz: -42, s: 0.84, fx: 380,  fy: -80 },
      { p: 0.84, rx: 50, rz: -42, s: 0.84, fx: 380,  fy: 20 },
      { p: 0.90, rx: 54, rz: -34, s: 0.68, fx: 0,    fy: 0 },
      { p: 1.00, rx: 14, rz: 0,   s: 1.00, fx: 0,    fy: 0 }
    ],
    explode: [0.08, 0.28, 0.90, 0.99],
    onMeasure: layout
  });
  const P = M.piece;

  P("window", "", { x: 0, y: 0, w: 1440, h: 900, z: 0, thick: 16 });
  P("dots", "<i></i><i></i><i></i>", { x: 20, y: 14, z: 30 });
  P("chip", `<img src="${AVATAR}" alt=""><div><b>${esc(A.name)}</b><span><i></i>${esc(A.status)}</span></div>`, { x: 20, y: 38, z: 44, thick: 6, shadow: true });
  const right = [
    P("round", ICON.globe, { y: 40, z: 40, thick: 4 }),
    P("cta", ICON.list + esc(A.pending) + `<u>${esc(A.pendingCount)}</u>`, { y: 40, z: 48, thick: 6, shadow: true })
  ];
  P("card audio", `<b>${esc(A.audio.title)}</b><div class="play"><i></i><div class="wave">${wave}</div>${esc(A.audio.length)}</div>`, { x: 36, y: 108, w: 330, z: 60, thick: 6, shadow: true });
  P("card guide", `<b>${esc(A.guide.title)}</b><p>${esc(A.guide.text)}</p><div class="foot"><span class="mini">${esc(A.guide.read)}</span>${esc(A.guide.meta)}</div>`, { x: 382, y: 108, w: 370, z: 60, thick: 6, shadow: true });
  // The question leaves the text field; the answer and the table arrive after it.
  const ask = P("bubble me", esc(A.question), { z: 70, thick: 6, shadow: true, enter: [0.32, 0.40], from: { x: -420, y: 520, z: -60, s: 0.8 }, arc: 90 });
  const ans = P("bubble her", A.answer.map(t => `<p>${esc(t)}</p>`).join(""), { x: 36, w: 700, z: 64, thick: 6, shadow: true, enter: [0.46, 0.53], from: { y: 50, z: 150, s: 0.94 }, arc: 40 });
  const T = A.table;
  const table = P("card table", `<b>${esc(T.title)}</b><div class="tr th"><span>${esc(T.head[0])}</span><span>${esc(T.head[1])}</span></div>` + T.rows.map(r => `<div class="tr"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join("") + `<div class="foot"><span class="mini">${esc(T.expand)}</span><span class="mini ghost">${esc(T.copy)}</span></div>`, { x: 36, w: 470, z: 84, thick: 6, shadow: true, enter: [0.55, 0.63], from: { y: 70, z: 220, s: 0.9 }, arc: 60 });
  P("round plain", ICON.plus, { x: 24, y: 836, z: 44, thick: 4 });
  P("field", esc(A.composer), { x: 82, y: 834, w: 884, z: 44, thick: 4 });
  P("round plain", ICON.mic, { x: 978, y: 836, z: 44, thick: 4 });

  // Side panel: each card is its own layer, stepped in depth.
  P("side", "", { x: 1052, y: 10, w: 378, h: 880, z: 130, thick: 8, shadow: true });
  P("greet", `<img src="${AVATAR}" alt=""><div><b>${esc(A.greeting.title)}</b><p>${esc(A.greeting.text)}</p></div>`, { x: 1070, y: 34, w: 340, z: 144 });
  const cards = A.cards.map((c, i) => P("pc " + c.tone, `<h3><i></i>${esc(c.title)}${c.count ? `<u>${esc(c.count)}</u>` : ""}</h3>` + c.items.map(it => `<div class="it${it.text ? "" : " bare"}"><div>${it.text ? esc(it.text) : ""}<small>${esc(it.note || "")}</small></div>${it.due ? `<em>${esc(it.due)}</em>` : ""}</div>`).join(""), { x: 1066, w: 350, z: 160 + i * 8, thick: 6, shadow: true, under: 130 }));

  // Everything is placed from its real size, so longer or shorter text never overlaps.
  function layout() {
    let x = 1030; [...right].reverse().forEach(q => { x -= q.el.offsetWidth; q.el.style.left = x + "px"; x -= 12; });

    ask.el.style.left = (1030 - ask.el.offsetWidth) + "px"; ask.el.style.top = y + "px"; y += ask.el.offsetHeight + 22;

    cards.forEach(q => { q.el.style.top = cy + "px"; cy += q.el.offsetHeight + 12; });
  }
