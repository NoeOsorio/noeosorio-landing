<title>Essay Studio Layers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<!-- ============================================================
     EDIT HERE. Every word on the page comes from this block.
     Change a text, reload, and the 3D model rebuilds itself.
     In "body", {em:...} {sis:...} {cri:...} mark what each agent underlines.
     ============================================================ -->
<script>
const CONTENT = {
  captions: [
    { title: "Essay Studio", text: "A writing app where AI agents question your essay instead of writing it for you." },
    { title: "You write.", text: "The essay stays yours. Nothing is written for you." },
    { title: "Agents ask.", text: "Evidence, Systems and Objections each leave their questions on the board." },
    { title: "Then they review.", text: "Every claim to check is underlined in its agent's color, with a score." }
  ],
  app: {
    back: "Ensayos",
    ask: "Hazme preguntas",
    review: "Revisar ensayo",
    score: "4.0",
    title: "La paradoja de la seguridad psicológica en equipos remotos",
    body: "{sis:Edmondson definió la seguridad} psicológica como {sis:la creencia compartida de} que el {sis:equipo es seguro para} tomar riesgos interpersonales. {em:En equipos remotos esa} creencia se {em:sostiene con rituales pequeños:} el café, la {em:mirada, el silencio cómodo} después de {cri:una pregunta. Sin} ellos, todos {cri:asumen que preguntar} es {cri:arriesgado y el} {em:equipo deja de aprender.}",
    agents: {
      em:  { name: "Evidencia" },
      sis: { name: "Sistemas" },
      cri: { name: "Objeciones" }
    },
    notes: [
      { agent: "em",  text: "¿En qué muestra se midió ese efecto y con qué N?" },
      { agent: "em",  text: "¿La cita de Edmondson es del estudio original o de una review?" },
      { agent: "em",  text: "¿Qué instrumento medible reemplazaría la frase «rituales sostienen seguridad»?" },
      { agent: "sis", text: "¿Qué loop de retroalimentación sostiene este comportamiento?" },
      { agent: "sis", text: "¿Estás explicando una dinámica estructural con causas individuales?" },
      { agent: "sis", text: "¿Dónde está el punto de apalancamiento implícito?" },
      { agent: "cri", text: "¿Cuál sería el steelman del lado opuesto?" },
      { agent: "cri", text: "¿Quién no aparece en esta historia?" },
      { agent: "cri", text: "¿Qué supuestos ideológicos asume el autor sin examinar?" }
    ]
  }
};
</script>

<style>
  /* Layout: one pinned stage; the app sits in 3D on the right, one caption at a time on the left. */
  :root {
    color-scheme: dark;
    --night: #0E0D0B; --ink: #F4EEE4; --quiet: rgba(244,238,228,.72); --lime: #D6F35C;
    --paper: #FAF8F3; --sheet: #FFFFFF; --board: #F4F1E8; --dot: #CFC8B6; --app-ink: #1D1B18; --app-ink-3: #6B665C;
    --em-bg: #FFE08A; --em-ink: #6E4600; --em-text: #2B2410; --em-line: #F5C542;
    --sis-bg: #BDEBD6; --sis-ink: #0D5E46; --sis-text: #0F2E24; --sis-line: #7FD3AE;
    --cri-bg: #E3D5FF; --cri-ink: #563397; --cri-text: #24163F; --cri-line: #B9A0F0;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --ui: "Geist", system-ui, sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --mono: "Geist Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--ink); font-family: var(--ui); }
  #track { height: 620vh; position: relative; }
  #stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: clip; }
  .light { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .light.a { width: 46vw; height: 46vw; left: 38%; top: 18%; background: rgba(236,168,88,.20); }
  .light.b { width: 40vw; height: 40vw; right: -8%; bottom: -12%; background: rgba(40,140,150,.22); }

  .captions { position: absolute; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: 7vh; pointer-events: none; }
  .cap { position: absolute; left: 0; top: 0; max-width: 23rem; opacity: 0; will-change: transform, opacity; }
  .cap h2 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 4.2vw, 3.6rem); line-height: 1; letter-spacing: -0.035em; margin: 0 0 .9rem; text-wrap: balance; }
  .cap p { font-size: clamp(1rem, 1.3vw, 1.15rem); line-height: 1.55; color: var(--quiet); margin: 0; }
  @media (min-width: 900px) { .captions { left: 5vw; top: 50%; transform: translateY(-9rem); } }

  .scene { position: absolute; inset: 0; perspective: 4200px; perspective-origin: 50% 42%; }
  .rig { position: absolute; left: 50%; top: 52%; width: 1440px; height: 900px; margin: -450px 0 0 -720px; transform-style: preserve-3d; will-change: transform; }
  .piece { position: absolute; transform-style: preserve-3d; border-radius: var(--r, 12px); background: var(--bg, transparent); }
  .edge { position: absolute; inset: 0; border-radius: inherit; background: var(--edge, #D9D3C5); }
  .sh { position: absolute; inset: 0; border-radius: inherit; background: rgba(20,14,4,.55); filter: blur(18px); opacity: 0; pointer-events: none; }

  .window { --bg: var(--paper); --edge: #CFC9BB; --r: 22px; left: 0; top: 0; width: 1440px; height: 900px; }
  .sheet { --bg: var(--sheet); --edge: #DAD5C9; --r: 22px; left: 10px; top: 64px; width: 720px; height: 826px; }
  .board { --bg: var(--board); --edge: #D2CBB9; --r: 22px; left: 740px; top: 64px; width: 690px; height: 826px; background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px); background-size: 22px 22px; background-color: var(--board); }
  .btn { --r: 12px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font: 500 14px var(--ui); color: var(--app-ink); white-space: nowrap; }
  .btn.soft { --bg: #F1EEE6; --edge: #D6D0C2; }
  .btn.line { --bg: #fff; --edge: #D6D0C2; box-shadow: inset 0 0 0 1px rgba(29,27,24,.12); }
  .btn.dark { --bg: #1D1B18; --edge: #000; color: #fff; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .stamp { --bg: #fff; --edge: #BBB5A6; --r: 6px; height: 30px; padding: 0 9px; display: flex; align-items: center; font: 600 15px var(--mono); color: var(--app-ink); box-shadow: inset 0 0 0 2px var(--app-ink); }
  .title { left: 76px; top: 164px; width: 590px; font: 500 46px/1.1 var(--serif); letter-spacing: -0.01em; color: var(--app-ink); }
  .para { left: 76px; top: 262px; width: 600px; font: 400 23px/1.62 var(--serif); color: #2A2723; }
  .w { display: inline-block; white-space: pre; position: relative; transform-style: preserve-3d; will-change: transform; }
  .w .u { position: absolute; left: 0; right: 0; bottom: 4px; height: 3px; border-radius: 2px; transform: scaleX(0); transform-origin: left center; }
  .w[data-a="em"] .u { background: var(--em-line); } .w[data-a="sis"] .u { background: var(--sis-line); } .w[data-a="cri"] .u { background: var(--cri-line); }
  .w.last .u { right: .28em; }
  .note { --r: 3px; box-sizing: border-box; width: 196px; padding: 14px 14px 16px; font: 500 14.5px/1.38 var(--serif); }
  .note b { display: flex; align-items: center; gap: 6px; font: 600 11px var(--ui); margin-bottom: 7px; }
  .note b i { width: 7px; height: 7px; border-radius: 4px; background: currentColor; }
  .note .tape { position: absolute; left: 50%; top: -9px; width: 54px; height: 18px; margin-left: -27px; background: rgba(255,253,245,.78); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .note[data-a="em"] { --bg: var(--em-bg); --edge: #D9B955; color: var(--em-text); } .note[data-a="em"] b { color: var(--em-ink); }
  .note[data-a="sis"] { --bg: var(--sis-bg); --edge: #8FC9B0; color: var(--sis-text); } .note[data-a="sis"] b { color: var(--sis-ink); }
  .note[data-a="cri"] { --bg: var(--cri-bg); --edge: #B9A6E0; color: var(--cri-text); } .note[data-a="cri"] b { color: var(--cri-ink); }
  .tools { --bg: #fff; --edge: #D6D0C2; --r: 14px; left: 756px; top: 834px; height: 44px; padding: 0 6px; display: flex; align-items: center; gap: 4px; }
  .tools span { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--app-ink); }
  .tools span:first-child { background: #1D1B18; color: #fff; }
  .tools svg { width: 17px; height: 17px; }

  @media (prefers-reduced-motion: reduce) { #track { height: 100vh; height: 100dvh; } }
</style>

<div id="track">
  <div id="stage">
    <div class="light a"></div><div class="light b"></div>
    <div class="captions" id="captions"></div>
    <div class="scene"><div class="rig" id="rig"></div></div>
  </div>
</div>

<script>
(() => {
  const A = CONTENT.app, rig = document.getElementById("rig");
  const ICON = {
    back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
    ask: '<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="9" height="9" rx="1.5" fill="#BDEBD6"/><rect x="5" y="2.5" width="9" height="9" rx="1.5" fill="#FFE08A" stroke="#C9A640" stroke-width=".8"/></svg>',
    cursor: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5l8.5 5-3.6.9 2 3.8-1.6.8-2-3.8L4.8 12z"/></svg>',
    sticky: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 3h10v6.5L9.5 13H3z"/><path d="M13 9.5H9.5V13"/></svg>',
    arrow: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5l9-9M6.5 3.5h6v6"/></svg>'
  };
  const pieces = [];
  // A piece is one independent element of the app: its own depth, thickness and shadow.
  function piece(cls, html, o) {
    const el = document.createElement("div");
    el.className = "piece " + cls; el.innerHTML = html || "";
    if (o.x != null) { el.style.left = o.x + "px"; el.style.top = o.y + "px"; }
    const n = Math.round((o.thick || 0) / 2);
    for (let i = n; i >= 1; i--) { const e = document.createElement("div"); e.className = "edge"; e.style.transform = `translateZ(${-i * 2}px)`; el.prepend(e); }
    let sh = null;
    if (o.shadow) { sh = document.createElement("div"); sh.className = "sh"; el.prepend(sh); }
    rig.appendChild(el);
    const p = Object.assign({ el, sh, z: 0, under: 0, rot: 0 }, o); pieces.push(p); return p;
  }

  piece("window", "", { z: 0, thick: 16 });
  piece("btn soft", ICON.back + esc(A.back), { x: 90, y: 14, z: 70, thick: 4 });
  const askTop = piece("btn line", ICON.ask + esc(A.ask), { x: 1010, y: 14, z: 70, thick: 4 });
  const stamp = piece("stamp", esc(A.score), { x: 1196, y: 17, z: 110, thick: 4, rot: -3, shadow: true, under: 0 });
  piece("btn dark", ICON.check + esc(A.review), { x: 1262, y: 14, z: 70, thick: 4 });
  const board = piece("board", "", { z: 130, thick: 8, shadow: true, under: 0 });
  piece("tools", `<span>${ICON.cursor}</span><span>${ICON.sticky}</span><span>${ICON.arrow}</span>`, { z: 190, thick: 4, under: 130 });
  const askBoard = piece("btn line", ICON.ask + esc(A.ask), { x: 1000, y: 650, z: 200, thick: 4, under: 130 });
  piece("sheet", "", { z: 250, thick: 8, shadow: true, under: 0 });
  piece("title", esc(A.title), { z: 272 });
  const para = piece("para", "", { z: 272 });

  // Paragraph: every word is its own element, so the text can ripple and each underline can draw.
  const words = [];
  A.body.replace(/\{(\w+):([^}]*)\}|([^{]+)/g, (m, agent, marked, plain) => {
    const parts = (marked ?? plain).split(/(?<=\s)/);
    parts.forEach((t, i) => {
      if (!t) return;
      const s = document.createElement("span"); s.className = "w"; s.textContent = t;
      if (agent) { s.dataset.a = agent; if (i === parts.length - 1) s.classList.add("last"); const u = document.createElement("span"); u.className = "u"; s.appendChild(u); }
      para.el.appendChild(s); words.push({ el: s, u: s.querySelector(".u") });
    });
    return m;
  });
  const marked = words.filter(w => w.u);
  const titleEl = rig.querySelector('.title');
  // The paragraph starts where the title ends, so a longer or shorter title never overlaps it.
  const flow = () => { para.el.style.top = (titleEl.offsetTop + titleEl.offsetHeight + 30) + 'px'; };

  // Notes: three columns on the board, one per agent, measured from their real height.
  const cols = Object.keys(A.agents), notes = [];
  const colY = cols.map(() => 150);
  A.notes.forEach((n, i) => {
    const c = cols.indexOf(n.agent);
    const p = piece("note", `<span class="tape"></span><b><i></i>${esc(A.agents[n.agent].name)}</b>${esc(n.text)}`, { z: 400 + c * 26, thick: 4, shadow: true, under: 130, rot: [-1.4, 1.1, -0.6, 0.9, -1.2, 0.7, 1.3, -0.9, 0.5][i % 9] });
    p.el.dataset.a = n.agent; p.sx = 770 + c * 216; p.sy = colY[c]; p.i = notes.length;
    p.el.style.left = p.sx + "px"; p.el.style.top = p.sy + "px";
    colY[c] += p.el.offsetHeight + 26; notes.push(p);
  });

  const caps = CONTENT.captions.map(c => { const d = document.createElement("div"); d.className = "cap"; d.innerHTML = `<h2>${esc(c.title)}</h2><p>${esc(c.text)}</p>`; document.getElementById("captions").appendChild(d); return d; });
  function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  // ---- timeline -------------------------------------------------------------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a));
  const io = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // ease-in-out: on-screen movement
  const out = t => 1 - Math.pow(1 - t, 4);                                    // ease-out: things arriving
  const mix = (a, b, t) => a + (b - a) * t;
  // Camera stops: p, tilt, turn, zoom, and the point of the app it looks at.
  const CAM = [
    { p: 0.00, rx: 16, rz: 0,   s: 1.00, fx: 0,    fy: 0 },
    { p: 0.08, rx: 16, rz: 0,   s: 1.00, fx: 0,    fy: 0 },
    { p: 0.28, rx: 56, rz: -36, s: 0.66, fx: 0,    fy: 0 },
    { p: 0.42, rx: 50, rz: -28, s: 0.88, fx: -250, fy: -60 },
    { p: 0.50, rx: 52, rz: -34, s: 0.82, fx: 200,  fy: -40 },
    { p: 0.66, rx: 50, rz: -38, s: 0.84, fx: 260,  fy: -20 },
    { p: 0.76, rx: 54, rz: -34, s: 0.70, fx: 0,    fy: 0 },
    { p: 0.86, rx: 54, rz: -34, s: 0.70, fx: 0,    fy: 0 },
    { p: 1.00, rx: 14, rz: 0,   s: 1.00, fx: 0,    fy: 0 }
  ];
  function cam(p) {
    let i = 0; while (i < CAM.length - 2 && p > CAM[i + 1].p) i++;
    const a = CAM[i], b = CAM[i + 1], t = io(seg(p, a.p, b.p)), o = {};
    for (const k of ["rx", "rz", "s", "fx", "fy"]) o[k] = mix(a[k], b[k], t);
    return o;
  }
  const CAPS = [[-1, 0.12], [0.24, 0.44], [0.50, 0.68], [0.72, 2]];

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, fit = 1, shift = 0, lineOf = [];
  function measure() {
    W = innerWidth; H = innerHeight; flow();
    const wide = W >= 900;
    fit = Math.min((wide ? W * 0.63 : W * 0.98) / 1440, H * (wide ? 0.86 : 0.62) / 900);
    shift = wide ? W * 0.16 : 0;
    document.querySelector('.scene').style.perspectiveOrigin = `calc(50% + ${shift}px) 46%`;
    const tops = [...new Set(words.map(w => w.el.offsetTop))].sort((a, b) => a - b);
    lineOf = words.map(w => tops.indexOf(w.el.offsetTop));
  }
  let target = 0, cur = 0, mx = 0, my = 0, cmx = 0, cmy = 0;
  function readScroll() {
    const tr = document.getElementById("track"), max = tr.offsetHeight - H;
    target = reduce ? 1 : clamp(max > 0 ? -tr.getBoundingClientRect().top / max : 0);
  }
  addEventListener("scroll", readScroll, { passive: true });
  addEventListener("resize", () => { measure(); readScroll(); });
  if (matchMedia("(hover: hover) and (pointer: fine)").matches && !reduce)
    addEventListener("pointermove", e => { mx = e.clientX / W - .5; my = e.clientY / H - .5; });

  function render(p) {
    const e = io(seg(p, 0.08, 0.28)) * (1 - io(seg(p, 0.86, 0.98)));   // how far apart the layers are
    const c = cam(p);
    rig.style.transform = `translate3d(${shift}px,${H < 700 ? 30 : 0}px,0) scale(${fit * c.s}) rotateX(${c.rx + cmy * -5}deg) rotateZ(${c.rz + cmx * 7}deg) translate3d(${-c.fx}px,${-c.fy}px,${-190 * e}px)`;

      // Keep the whole app inside the screen: if the camera would cut it off, pull it back in.
      { const sc = document.querySelector(".scene"); sc.style.transform = ""; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (const q of pieces) { if (q.enter || q.cls === "note") continue; const b = q.el.getBoundingClientRect(); if (!b.width) continue; x0 = Math.min(x0, b.left); y0 = Math.min(y0, b.top); x1 = Math.max(x1, b.right); y1 = Math.max(y1, b.bottom); }
        const r = { left: x0, top: y0, width: x1 - x0, height: y1 - y0 }, m = 20;
        const f = Math.min(1, (W - 2 * m) / r.width, (H - 2 * m) / r.height);
        const cx = W / 2 + (r.left + r.width / 2 - W / 2) * f, cy = H / 2 + (r.top + r.height / 2 - H / 2) * f, hw = r.width * f / 2, hh = r.height * f / 2;
        const dx = cx - hw < m ? m - (cx - hw) : cx + hw > W - m ? W - m - (cx + hw) : 0;
        const dy = cy - hh < m ? m - (cy - hh) : cy + hh > H - m ? H - m - (cy + hh) : 0;
        sc.style.transform = `translate(${dx}px,${dy}px) scale(${f})`; }

    const asked = seg(p, 0.46, 0.50), reviewed = out(seg(p, 0.78, 0.84));
    for (const q of pieces) {
      if (q.cls === "note") continue;
      let z = q.z * e, op = 1, sc = 1;
      if (q === askBoard) op = 1 - asked;
      if (q === askTop) op = asked;
      if (q === stamp) { op = reviewed; z += (1 - reviewed) * 260; sc = mix(1.5, 1, reviewed); }
      q.el.style.transform = `translate3d(0,0,${z}px) rotate(${q.rot}deg) scale(${sc})`;
      q.el.style.opacity = op >= 1 ? '' : op;
      if (q.sh) { const lift = (q.z - q.under) * e; q.sh.style.transform = `translate3d(${lift * .1}px,${lift * .16}px,${-lift + 2}px)`; q.sh.style.opacity = .5 * Math.min(1, lift / 90) * op; }
    }
    // The text ripples line by line while the camera reads it.
    const wave = seg(p, 0.26, 0.46) * (words.length + 12) - 6, live = e;
    words.forEach((w, i) => {
      const d = (i - wave) / 6, bump = Math.exp(-d * d) * 14 * live;
      w.el.style.transform = `translateZ(${bump}px)`;
    });
    // Notes leave the page and land on the board, one after another.
    notes.forEach(n => {
      const t = seg(p, 0.48 + n.i * 0.018, 0.56 + n.i * 0.018), k = out(t);
      const ox = 300 - n.sx, oy = 380 - n.sy;
      const x = ox * (1 - k), y = oy * (1 - k);
      const base = (n.z * e), arc = Math.sin(Math.PI * Math.min(1, t)) * 150 * (0.4 + 0.6 * e), from = (300 - n.z) * e * (1 - k);
      n.el.style.transform = `translate3d(${x}px,${y}px,${base + from + arc}px) rotate(${n.rot * k - 8 * (1 - k)}deg) scale(${mix(.72, 1, k)})`;
      { const o = clamp(t * 14); n.el.style.opacity = o >= 1 ? '' : o; }
      const lift = (n.z - n.under) * e + arc;
      n.sh.style.transform = `translate3d(${lift * .1}px,${lift * .16}px,${-lift + 2}px)`; n.sh.style.opacity = .45 * Math.min(1, lift / 90) * clamp(t * 6);
    });
    // Review: each underline draws in reading order.
    const draw = seg(p, 0.70, 0.82) * (marked.length + 4);
    marked.forEach((w, i) => { w.u.style.transform = `scaleX(${out(clamp(draw - i))})`; });

    caps.forEach((d, i) => {
      const [a, b] = CAPS[i], v = clamp(Math.min((p - a) / 0.04, (b - p) / 0.04));
      d.style.opacity = v; d.style.transform = `translate3d(0,${(1 - v) * 10}px,0)`;
    });
  }
  pieces.forEach(q => { q.cls = q.el.classList.contains("note") ? "note" : ""; });

  let last = -1;
  function frame() {
    cur += (target - cur) * 0.14; if (Math.abs(target - cur) < 0.0004) cur = target;
    cmx += (mx - cmx) * 0.08; cmy += (my - cmy) * 0.08;
    const key = cur + cmx * 3 + cmy * 7;
