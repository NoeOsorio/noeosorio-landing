<meta charset="utf-8">
<title>Idea Galaxy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">

<!-- ============================================================
     EDIT HERE. Every word in the hero comes from this block.
     heavy: the big concepts, they become the planets on the orbits.
     ideas: real things (projects, jobs, skills, interests, videos). Each becomes a star.
     eggs: jokes mixed in with the ideas. They look like any other star.
     ============================================================ -->

    "Finloop", "Loans that approve themselves", "Smartkode", "Tech lead", "Mentoring juniors", "Kubernetes", "Flutter", "Firebase",
    "Rust", "Tauri", "Next.js", "TypeScript", "MongoDB", "System design", "Product design", "UX", "AI agents", "AI workflows", "llms.txt",
    "A reverse captcha", "A passport for my career", "A wallet for my projects", "A tip jar that judges you", "A slot machine for videos",

    "Talking a lot", "Listening to people", "New York", "San Francisco", "Mexico City", "Puebla", "Iowa", "Skydiving in Hawaii",

<style>
  /* One full screen: a canvas where every idea becomes a star, the copy sits on top. */
  :root {
    color-scheme: dark;
    --night: #0E0D0B; --ink: #F4EEE4; --ink-2: rgba(244,238,228,.74); --ink-3: rgba(244,238,228,.5);
    --lime: #C6F06B; --led: #9FD043; --hot: #F2FFD2;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Geist", system-ui, -apple-system, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  html, body { margin: 0; background: var(--night); color: var(--ink); }
  body { font-family: var(--body); }
  .hero { position: relative; height: 100vh; height: 100svh; min-height: 660px; overflow: hidden; background: var(--night); }
  .hero canvas { position: absolute; inset: 0; display: block; touch-action: pan-y; }
  .bar { position: absolute; inset: 0 0 auto; z-index: 3; display: flex; align-items: center; justify-content: space-between;
         padding: 26px max(16px, env(safe-area-inset-right, 0px), 4vw) 0 max(16px, env(safe-area-inset-left, 0px), 4vw); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font: 600 17px var(--body); }
  .brand svg { width: 34px; height: 24px; }
  .subbtn { height: 42px; padding: 0 20px; border-radius: 11px; background: var(--lime); color: #15210A; font: 700 14.5px var(--body); text-decoration: none; display: inline-flex; align-items: center; transition: transform 160ms var(--ease-out); }
  .subbtn:active { transform: scale(.97); }
  .subbtn:focus-visible, .brand:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  .copy { position: absolute; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px), 4vw); top: 19%; width: min(36vw, 540px); pointer-events: none; }
  .copy h1 { margin: 0; font: 700 clamp(2.8rem, 5.6vw, 5.6rem)/.94 var(--display); letter-spacing: -0.045em; text-wrap: balance; }
  .copy h1 em { font-style: normal; color: var(--lime); }
  .copy p { margin: 26px 0 0; max-width: 25rem; font-size: 18px; line-height: 1.55; color: var(--ink-2); }
  .copy p b { color: var(--ink); font-weight: 500; }
  .copy > * { animation: heroRise 900ms var(--ease-out) both; }
  .copy p { animation-delay: 1500ms; } .copy h1 { animation-delay: 900ms; }
  @keyframes heroRise { from { opacity: 0; transform: translateY(10px); } }
  .tip { position: absolute; z-index: 4; left: 0; top: 0; padding: 7px 11px; border-radius: 9px; background: rgba(14,13,11,.9); box-shadow: inset 0 0 0 1px rgba(198,240,107,.35), 0 10px 24px rgba(0,0,0,.5);
         font: 500 13px var(--mono); color: var(--hot); white-space: nowrap; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity 140ms ease, transform 140ms var(--ease-out); }
  .tip.on { opacity: 1; transform: none; }
  @media (max-width: 760px) {
    .bar { padding-top: 18px; } .brand span { display: none; }

    .copy h1 { font-size: clamp(2.4rem, 11vw, 3.4rem); }
    .copy p { font-size: 16.5px; margin-top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .copy > * { animation: none; } }
</style>

<section class="hero" id="hero" aria-labelledby="hero-title">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="bar">
    <a class="brand" href="#" aria-label="Home"><svg viewBox="60 100 280 200" fill="#C6F06B" aria-hidden="true"><path d="M123 111 L225 111 L250 154 L225 198 L199 155 L150 155 L123 198 L147 243 L97 243 L72 199 Z M252 156 L302 156 L327 200 L276 288 L175 288 L149 244 L174 200 L200 244 L250 244 L276 200 Z"/></svg><span id="hero-name"></span></a>
    <a class="subbtn" id="hero-sub"></a>
  </div>
  <div class="copy">
    <h1 id="hero-title"></h1>
    <p id="hero-p"></p>
  </div>
  <div class="tip" id="hero-tip" role="status"></div>
</section>

<script>
(() => {
  const C = CONTENT, hero = document.getElementById("hero"), cv = document.getElementById("sky"), ctx = cv.getContext("2d"), tip = document.getElementById("hero-tip");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, touch = matchMedia("(hover: none)").matches;
  document.getElementById("hero-name").textContent = C.name;
  const sb = document.getElementById("hero-sub"); sb.textContent = C.subscribe; sb.href = C.subscribeHref;
  // The name is lime, and the first sentence gets its own line.
  const h1 = document.getElementById("hero-title"), [a, b] = C.title.split(". "), em = document.createElement("em");
  em.textContent = C.name.split(" ")[0]; h1.append(a.replace(em.textContent, ""), em, ".", document.createElement("br"), b);
  const p = document.getElementById("hero-p"); p.textContent = C.sub + " "; const hint = document.createElement("b"); hint.textContent = touch ? C.hintTouch : C.hintMouse; p.append(hint);

  // ---------- Easing (strong ease-out for arrivals, strong ease-in-out for flights) ----------
  const eOut = t => 1 - Math.pow(1 - t, 4), eInOut = t => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
  const eBack = t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const shuffle = arr => { const o = arr.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };

  // ---------- The logo, rasterized once into LED cells ----------
  const LOGO = new Path2D("M123 111 L225 111 L250 154 L225 198 L199 155 L150 155 L123 198 L147 243 L97 243 L72 199 Z M252 156 L302 156 L327 200 L276 288 L175 288 L149 244 L174 200 L200 244 L250 244 L276 200 Z");
  const GW = 30, GH = 21, raster = [];
  { const o = document.createElement("canvas"); o.width = GW; o.height = GH; const x = o.getContext("2d"); x.scale(GW / 280, GH / 200); x.translate(-60, -100); x.fill(LOGO);
    const d = x.getImageData(0, 0, GW, GH).data; for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) if (d[(gy * GW + gx) * 4 + 3] > 100) raster.push({ gx, gy }); }

  // ---------- Layout ----------
  let W = 0, H = 0, cx = 0, cy = 0, R = 0, cell = 0, ox = 0, oy = 0, avoid = [], grid = null, mobile = false;
  function layout() {
    const r = hero.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mobile = W < 760;
    cx = mobile ? W * .5 : W * .66; cy = mobile ? H * .34 : H * .54;
    R = mobile ? Math.min(W * .4, H * .2) : Math.min(W * .24, H * .36);
    const L = R * 1.22; cell = L / GW; ox = cx - L / 2; oy = cy - (GH * cell) / 2;
    avoid = [...hero.querySelectorAll(".copy > *, .bar")].map(el => { const q = el.getBoundingClientRect(); return { x: q.left - r.left - 18, y: q.top - r.top - 14, w: q.width + 36, h: q.height + 28 }; });
    // The empty slots the ideas will fill: a faint dot lattice inside the inner circle.
    grid = document.createElement("canvas"); grid.width = W * dpr; grid.height = H * dpr; const g = grid.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = "rgba(198,240,107,.07)"; const s = cell * .5;
    for (let gy = -12; gy < GH + 12; gy++) for (let gx = -12; gx < GW + 12; gx++) {
      const x = ox + (gx + .5) * cell, y = oy + (gy + .5) * cell; if (Math.hypot(x - cx, y - cy) > R * .8) continue;
      g.beginPath(); g.roundRect(x - s / 2, y - s / 2, s, s, s * .25); g.fill();
    }
  }
  const cellPos = i => ({ x: ox + (raster[i].gx + .5) * cell, y: oy + (raster[i].gy + .5) * cell });
  const RINGS = [.98, 1.13, .86], SPIN = [.00016, -.00011, .00021];
  const planetPos = (pl, t) => { const r = R * RINGS[pl.ring], an = pl.a0 + SPIN[pl.ring] * t; return { x: cx + Math.cos(an) * r, y: cy + Math.sin(an) * r, an, r }; };
  const skyPos = s => ({ x: s.u * W, y: s.v * H });
  const hits = (x, y, w, h) => avoid.some(q => x < q.x + q.w && x + w > q.x && y < q.y + q.h && y + h > q.y);
  function freeSpot(w, h, near) {
    for (let k = 0; k < 60; k++) {
      let x, y;
      if (near) { const an = rnd() * Math.PI * 2, d = R * (1.25 + rnd() * .8); x = cx + Math.cos(an) * d - w / 2; y = cy + Math.sin(an) * d - h / 2; }
      else { x = 16 + rnd() * (W - 32 - w); y = 80 + rnd() * (H - 120 - h); }
      if (x < 12 || y < 70 || x + w > W - 12 || y + h > H - 12) continue;
      if (Math.hypot(x + w / 2 - cx, y + h / 2 - cy) < R * .78) continue;
      if (hits(x, y, w, h)) continue;
      return { x: x + w / 2, y: y + h / 2 };
    }
    return { x: cx + (rnd() - .5) * R * 2.6, y: cy - R * 1.3 };
  }
  function skySpot() {
    for (let k = 0; k < 60; k++) { const u = rnd(), v = .1 + rnd() * .86, x = u * W, y = v * H; if (Math.hypot(x - cx, y - cy) < R * 1.22 || hits(x - 4, y - 4, 8, 8)) continue; return { u, v }; }
    return { u: rnd(), v: rnd() };
  }

  // ---------- The cast ----------
  const cellStar = new Array(raster.length).fill(null), sky = [], planets = [], live = [];
  let clock = 0, started = false, floodAt = 0, acc = 0, pulseAt = -1, finaleDone = false, idleNext = 0, burstAt = -1;
  const ideaQueue = shuffle(C.ideas.concat(C.eggs)), cellOrder = shuffle(raster.map((_, i) => i));
  const toLogo = Math.min(cellOrder.length, Math.round(ideaQueue.length * .72));
  let cellCursor = 0, idlePool = [];

  function measure(text, font) { ctx.font = font; return ctx.measureText(text).width; }
  function spawn(label, kind, extra = {}) {
    const heavy = kind === "heavy", font = heavy ? `600 ${mobile ? 19 : 26}px Geist` : `500 ${mobile ? 12 : 14}px "Geist Mono"`;
    const w = label ? measure(label, font) : 0, pos = extra.at || freeSpot(w, heavy ? 30 : 16, heavy || rnd() < .55);
    const s = { label, kind, font, w, sx: pos.x, sy: pos.y, t0: clock, appear: label ? 220 : 0, hold: extra.hold ?? 0, collapse: label ? 260 : 0,
      fly: extra.fly ?? 1000, target: extra.target, bend: (rnd() - .5) * .9, trail: [], size: heavy ? 4.6 : kind === "dust" ? 1.6 : 2.3, phase: rnd() * 6.28 };
    live.push(s); return s;
  }
  function targetPos(tg) { if (tg.k === "cell") return cellPos(tg.i); if (tg.k === "planet") return planetPos(planets[tg.p], clock); return skyPos(tg); }

  function step(dt) {
    clock += dt;
    // Heavy concepts first, one by one, around the circle.
    if (clock - dt < 400 && clock >= 400) C.heavy.forEach((label, i) => {
      planets[i] = { label, ring: i % 3, a0: (i / C.heavy.length) * Math.PI * 2 - Math.PI / 2 + (i % 3) * .5, arrived: -1 };
    });
    C.heavy.forEach((label, i) => { const at = 400 + i * 620; if (clock - dt < at && clock >= at) {
      const an = planets[i].a0 + SPIN[planets[i].ring] * (at + 2000), d = R * (mobile ? 1.38 : 1.5), w = measure(label, `600 ${mobile ? 19 : 26}px Geist`);
      let x = cx + Math.cos(an) * d, y = cy + Math.sin(an) * d; x = clamp(x, w / 2 + 16, W - w / 2 - 16); y = clamp(y, 90, H - 30);
      if (hits(x - w / 2, y - 16, w, 32)) { const f = freeSpot(w, 32, true); x = f.x; y = f.y; }
      spawn(label, "heavy", { at: { x, y }, hold: 820, fly: 1250, target: { k: "planet", p: i } });
    } });
    // Then the flood: ideas spawn faster and faster.
    if (!floodAt && clock > 400 + C.heavy.length * 620 + 300) floodAt = clock;
    if (floodAt && ideaQueue.length) {
      const e = clock - floodAt, rate = Math.min(34, 2.2 * Math.exp(e * .00052));
      acc += rate * dt / 1000;
      while (acc >= 1 && ideaQueue.length) { acc -= 1; const label = ideaQueue.shift(), hold = Math.max(150, 640 - e * .09);
        const target = cellCursor < toLogo ? { k: "cell", i: cellOrder[cellCursor++] } : { k: "sky", ...skySpot() };
        spawn(label, C.eggs.includes(label) ? "egg" : "idea", { hold, fly: 850 + rnd() * 450, target }); }
      if (!ideaQueue.length) floodAt = -1;
    }
    // Last push: star dust fills every empty slot of the logo.
    if (floodAt === -1 && cellCursor < cellOrder.length) {
      acc += 130 * dt / 1000;
      while (acc >= 1 && cellCursor < cellOrder.length) { acc -= 1; const an = rnd() * Math.PI * 2, d = R * (1.5 + rnd() * 1.2);
        spawn("", "dust", { at: { x: cx + Math.cos(an) * d, y: cy + Math.sin(an) * d }, fly: 650 + rnd() * 500, target: { k: "cell", i: cellOrder[cellCursor++] } }); }
    }
    if (!finaleDone && cellCursor >= cellOrder.length && cellStar.every(Boolean)) { finaleDone = true; pulseAt = clock; idleNext = clock + 2400; }
    // After that, the galaxy keeps growing: one new idea every few seconds.
    if (finaleDone && clock > idleNext) { idleNext = clock + 2600; if (!idlePool.length) idlePool = shuffle(C.ideas.concat(C.eggs));
      if (sky.length < 220) { const label = idlePool.shift(); spawn(label, C.eggs.includes(label) ? "egg" : "idea", { hold: 900, fly: 1300, target: { k: "sky", ...skySpot() } }); } }
    // Advance live stars and land the ones that arrived.
    for (let i = live.length - 1; i >= 0; i--) {
      const s = live[i], e = clock - s.t0, flyStart = s.appear + s.hold + s.collapse;
      if (e >= flyStart) { const k = clamp((e - flyStart) / s.fly), T = targetPos(s.target), mx = (s.sx + T.x) / 2, my = (s.sy + T.y) / 2, dx = T.x - s.sx, dy = T.y - s.sy;
        const c1x = mx - dy * s.bend, c1y = my + dx * s.bend, q = eInOut(k);
        s.x = (1 - q) * (1 - q) * s.sx + 2 * (1 - q) * q * c1x + q * q * T.x; s.y = (1 - q) * (1 - q) * s.sy + 2 * (1 - q) * q * c1y + q * q * T.y;
        s.trail.push([s.x, s.y]); if (s.trail.length > 9) s.trail.shift();
        if (k >= 1) { s.landed = clock; live.splice(i, 1);
          if (s.target.k === "cell") cellStar[s.target.i] = s; else if (s.target.k === "sky") sky.push(s); else planets[s.target.p].arrived = clock; }
      }
    }
  }

  // ---------- Drawing ----------
  function dot(x, y, size, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x - size / 2, y - size / 2, size, size, size * .24); ctx.fill(); }
  let px = 0, py = 0, tx = 0, ty = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    px += (tx - px) * .06; py += (ty - py) * .06;
    const gox = px * 7, goy = py * 7, sox = px * 16, soy = py * 16, t = clock, built = cellStar.filter(Boolean).length / raster.length;
    // Sky: ideas that became distant stars.

      for (let i = 0; i < 132; i++) { const an = rot + i / 132 * Math.PI * 2, r1 = R * .9, r2 = R * (i % 6 ? .925 : .94); ctx.moveTo(cx + Math.cos(an) * r1, cy + Math.sin(an) * r1); ctx.lineTo(cx + Math.cos(an) * r2, cy + Math.sin(an) * r2); }
      ctx.stroke(); }

        ctx.beginPath(); ctx.arc(cx, cy, P.r, Math.min(a1, a2), Math.max(a1, a2)); ctx.stroke(); }
      ctx.fillStyle = "rgba(198,240,107,.16)"; ctx.beginPath(); ctx.arc(P.x, P.y, 11, 0, 7); ctx.fill();
      ctx.fillStyle = "#F2FFD2"; ctx.beginPath(); ctx.arc(P.x, P.y, 4.6, 0, 7); ctx.fill(); });
    // The logo, one idea per LED.
    const pulse = pulseAt >= 0 ? (t - pulseAt) / 900 : -1, burst = burstAt >= 0 ? t - burstAt : -1;
    cellStar.forEach((s, i) => { if (!s) return; let { x, y } = cellPos(i);
      if (burst >= 0 && s.bx !== undefined) { const out = burst < 360 ? eOut(burst / 360) : 1 - eBack(clamp((burst - 360) / 1100)); x += s.bx * out; y += s.by * out; }
      const age = t - s.landed, land = clamp(age / 420), d = Math.hypot(x - cx, y - cy) / (R * .75);
      const wave = pulse >= 0 && pulse < 1.4 && Math.abs(d - pulse) < .09, twinkle = !reduce && Math.sin(t * .0021 + s.phase * 9) > .985;
      if (land < 1 && !reduce) { ctx.strokeStyle = `rgba(242,255,210,${(1 - land) * .8})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, cell * (.3 + land * 1.1), 0, 7); ctx.stroke(); }
      dot(x, y, cell * .74, wave || twinkle || land < .5 ? "#F2FFD2" : "#9FD043"); });

        ctx.font = s.font; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = s.kind === "heavy" ? "#F4EEE4" : "rgba(244,238,228,.9)"; ctx.fillText(s.label, 0, 0);
        if (s.kind === "heavy" && c === 0) { ctx.fillStyle = "#C6F06B"; ctx.beginPath(); ctx.arc(-s.w / 2 - 14, 0, 4, 0, 7); ctx.fill(); }
        ctx.restore(); ctx.globalAlpha = 1;
        if (c > 0) { const g = Math.sin(c * Math.PI) * 9; ctx.fillStyle = `rgba(242,255,210,${.25 * c})`; ctx.beginPath(); ctx.arc(s.sx, s.sy, s.size + g, 0, 7); ctx.fill();
          ctx.fillStyle = "#F2FFD2"; ctx.beginPath(); ctx.arc(s.sx, s.sy, s.size * c, 0, 7); ctx.fill(); } }
      else if (s.x !== undefined) {
        for (let k = 1; k < s.trail.length; k++) { ctx.strokeStyle = `rgba(198,240,107,${k / s.trail.length * .5})`; ctx.lineWidth = s.size * (k / s.trail.length); ctx.beginPath(); ctx.moveTo(...s.trail[k - 1]); ctx.lineTo(...s.trail[k]); ctx.stroke(); }
        ctx.fillStyle = "#F2FFD2"; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, 7); ctx.fill(); } }
  }

  // ---------- Loop: runs only while the hero is on screen and the tab is visible ----------
  let visible = false, running = false, last = 0;
  function frame(now) { if (!visible || document.hidden) { running = false; return; } const dt = Math.min(48, now - last); last = now; step(dt); draw(); requestAnimationFrame(frame); }
  function run() { if (running || reduce || !started) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; run(); }).observe(hero);
  document.addEventListener("visibilitychange", run);

  // Reduced motion: the finished galaxy, no motion.
  function buildStill() {
    clock = 20000; C.heavy.forEach((label, i) => { planets[i] = { label, ring: i % 3, a0: (i / C.heavy.length) * Math.PI * 2 - Math.PI / 2 + (i % 3) * .5, arrived: 0 }; });
    let q = shuffle(C.ideas.concat(C.eggs));
    cellOrder.forEach((ci, n) => { cellStar[ci] = { label: n < toLogo ? q[n] : "", kind: n < toLogo ? "idea" : "dust", landed: -9999, phase: rnd() * 6.28 }; });
    q.slice(toLogo).forEach(label => sky.push({ label, kind: "idea", target: skySpot(), landed: -9999, phase: 0 }));
    finaleDone = true;
  }

  // ---------- Hover or tap a star to read its idea ----------
  function nearest(x, y) {
    let best = null, bd = 16;
    const gx = x - px * 7, gy = y - py * 7;
    cellStar.forEach((s, i) => { if (!s || !s.label) return; const P = cellPos(i), d = Math.hypot(P.x - gx, P.y - gy); if (d < Math.min(bd, cell * .8)) { bd = d; best = { s, P: { x: P.x + px * 7, y: P.y + py * 7 } }; } });
    planets.forEach(pl => { if (!pl || pl.arrived < 0) return; const P = planetPos(pl, clock), d = Math.hypot(P.x - gx, P.y - gy); if (d < 18 && d < bd + 6) { bd = d; best = { s: pl, P: { x: P.x + px * 7, y: P.y + py * 7 } }; } });
    sky.forEach(s => { const P = skyPos(s.target), X = P.x + px * 16, Y = P.y + py * 16, d = Math.hypot(X - x, Y - y); if (d < bd) { bd = d; best = { s, P: { x: X, y: Y } }; } });
    return best;
  }
  function showTip(x, y) {
    const n = nearest(x, y);
    if (!n) { tip.classList.remove("on"); hero.style.cursor = ""; return; }
    tip.textContent = n.s.label; const w = tip.offsetWidth;
    tip.style.left = clamp(n.P.x - w / 2, 8, W - w - 8) + "px"; tip.style.top = (n.P.y - 44 < 60 ? n.P.y + 16 : n.P.y - 44) + "px";
    tip.classList.add("on"); hero.style.cursor = "default";
    if (reduce) draw();
  }
  hero.addEventListener("pointermove", e => { const r = hero.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; tx = (x / W - .5) * 2; ty = (y / H - .5) * 2;
    if (e.pointerType === "mouse") showTip(x, y); });
  hero.addEventListener("pointerleave", () => { tx = ty = 0; tip.classList.remove("on"); });
  // Click the logo and it blows apart into its ideas, then pulls itself back together.
  hero.addEventListener("pointerdown", e => {
    const r = hero.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (e.pointerType !== "mouse") showTip(x, y);
    if (reduce || !finaleDone || Math.hypot(x - cx, y - cy) > R * .62 || e.target.closest("a")) return;
    burstAt = clock; cellStar.forEach((s, i) => { if (!s) return; const P = cellPos(i), an = Math.atan2(P.y - cy, P.x - cx) + (rnd() - .5) * .8, d = R * (.35 + rnd() * .9); s.bx = Math.cos(an) * d; s.by = Math.sin(an) * d; });
  });

  addEventListener("resize", () => { clearTimeout(layout.t); layout.t = setTimeout(() => { layout(); if (reduce) draw(); }, 150); });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
    layout(); started = true;
    if (reduce) { buildStill(); draw(); } else run();
  });
})();
</script>
