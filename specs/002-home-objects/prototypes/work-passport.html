<style>
  /* One pinned stage: the passport lies open; scrolling turns its pages on the spine. */
  :root {
    color-scheme: dark;
    --night: #0E0D0B; --ink: #F4EEE4; --ink-2: rgba(244,238,228,.74);
    --paper: #EFE5CF; --paper-deep: #D6C6A6; --page-ink: #2B2418; --cover: #1C2633; --cover-edge: #121922; --glow: rgba(242,179,106,.18);
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Geist", system-ui, -apple-system, sans-serif;
    --city: "Newsreader", Georgia, "Times New Roman", serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  html, body { background: var(--night); color: var(--ink); }
  body { font-family: var(--body); }
  .head { position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 40rem; }
  .head h2 { margin: 0; font: 700 clamp(2.4rem, 5vw, 4rem)/1 var(--display); letter-spacing: -0.035em; text-wrap: balance; }
  .head p { margin: 0; font-size: clamp(1rem, 1.3vw, 1.125rem); line-height: 1.55; color: var(--ink-2); }

  .track { position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: clip; display: flex; flex-direction: column; box-sizing: border-box;
           padding-block: clamp(28px, 6vh, 72px) 20px; padding-left: max(16px, env(safe-area-inset-left, 0px), 5vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 5vw); }
  .glow { position: absolute; left: 50%; top: 60%; width: 46vw; height: 30vw; margin: -15vw 0 0 -23vw; border-radius: 50%; background: var(--glow); filter: blur(110px); pointer-events: none; }
  .room { position: relative; flex: 1; min-height: 0; perspective: 2800px; perspective-origin: 50% 28%; }
  .book { position: absolute; left: 50%; top: 50%; width: 1220px; height: 700px; transform-style: preserve-3d; }
  .book-shadow { position: absolute; inset: 24px 6px -14px; border-radius: 20px; background: rgba(0,0,0,.66); filter: blur(36px); transform: translateZ(-8px) translateY(30px); }
  /* Leather cover: it rims the right half from the start; the left half arrives with the opened cover. */
  .leather { background: radial-gradient(120% 90% at 30% 18%, #2A3A52 0%, var(--cover) 55%, #131B26 100%); }
  .rim { position: absolute; top: -12px; left: 598px; width: 634px; height: 724px; border-radius: 6px 22px 22px 6px; transform: translateZ(-6px); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.06); }
  /* Paper edges: a few offset sheets show how thick the book is. */
  .stackp { position: absolute; top: 0; width: 610px; height: 700px; background: #E2D6BB; transform: translateZ(-3px); }
  .stackp.r { left: 610px; border-radius: 0 14px 14px 0; box-shadow: 2px 2px 0 #CFC1A2, 4px 4px 0 #E5DAC1, 6px 5px 0 #CBBC9B, 8px 7px 0 #E1D5BB; }
  .stackp.l { left: 0; border-radius: 14px 0 0 14px; box-shadow: -2px 2px 0 #CFC1A2, -4px 4px 0 #E5DAC1, -6px 5px 0 #CBBC9B, -8px 7px 0 #E1D5BB; }
  .leaf { position: absolute; left: 610px; top: 0; width: 610px; height: 700px; transform-origin: 0 50%; transform-style: preserve-3d; }
  .leaf.coverleaf { top: -12px; width: 622px; height: 724px; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .shade, .cast { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .page.base-right { position: absolute; left: 610px; top: 0; }

  .page { position: relative; width: 610px; height: 700px; box-sizing: border-box; padding: 40px 52px; overflow: hidden; color: var(--page-ink); background: var(--paper); }
  .page.l { border-radius: 14px 0 0 14px; background: linear-gradient(90deg, var(--paper) 0%, var(--paper) 78%, #D9C8A4 95%, #BCA77E 100%); }
  .page.r { border-radius: 0 14px 14px 0; background: linear-gradient(90deg, #BCA77E 0%, #D9C8A4 5%, var(--paper) 22%, var(--paper) 100%); padding-left: 66px; }
  /* The thread that binds the book, along the spine. */
  .page.l::after, .page.r::after { content: ""; position: absolute; top: 34px; bottom: 34px; width: 0; border-left: 2px dashed rgba(150,46,40,.55); }
  .page.l::after { right: 7px; } .page.r::after { left: 7px; }
  .page h3 { position: relative; z-index: 1; margin: 0; font: italic 400 44px/1.05 var(--city); letter-spacing: -0.01em; }
  .visas { position: absolute; top: 52px; right: 48px; font: 600 11px/1 var(--body); letter-spacing: .34em; color: rgba(43,36,24,.5); }
  .security { position: absolute; inset: 0; pointer-events: none; }
  /* Inside of the cover and the cover itself. */
  .page.inside { color: #CFAE63; }
  .page.inside, .page.coverfront { background: radial-gradient(120% 90% at 70% 18%, #2A3A52 0%, var(--cover) 55%, #131B26 100%); }
  .page.inside { border-radius: 18px 4px 4px 18px; width: 622px; height: 724px; }
  .page.coverfront { width: 622px; height: 724px; border-radius: 4px 20px 20px 4px; display: flex; flex-direction: column; align-items: center; padding: 96px 60px 64px; color: #CFAE63; text-shadow: 0 1px 0 rgba(0,0,0,.45), 0 -1px 0 rgba(255,230,170,.12); }
  .page.inside::after, .page.coverfront::after { display: none; }
  .coverfront .frame { position: absolute; inset: 22px; border: 1.5px solid rgba(207,174,99,.45); border-radius: 12px; }
  .coverfront .word { font: 500 40px/1 var(--city); letter-spacing: .32em; margin-right: -.32em; }
  .coverfront .emblem { margin: 64px 0 auto; width: 230px; height: 230px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.45)); }
  .coverfront .name { font: 600 20px/1 var(--body); letter-spacing: .3em; margin-right: -.3em; }
  .coverfront .role { margin-top: 12px; font: 500 12px/1 var(--body); letter-spacing: .34em; margin-right: -.34em; opacity: .75; }
  .coverfront .chip { margin-top: 40px; width: 52px; height: 32px; }
  .stamp { position: absolute; z-index: 2; mix-blend-mode: multiply; cursor: pointer; }
  .stamp.main { z-index: 1; }
  .stamp svg { display: block; width: 100%; height: auto; overflow: visible; }
  .stamp.pending > svg { opacity: 0; }
  .press { position: absolute; inset: 4%; border-radius: var(--pr, 14px); background: rgba(38,28,12,.6); opacity: 0; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) {
    .stamp > svg { transition: transform 220ms var(--ease-out); }
    .stamp:hover > svg { transform: scale(1.04); }
  }

  .stack { display: none; }
  @media (max-width: 760px) {
    .track { display: none; }
    .stack { display: flex; flex-direction: column; gap: 28px; padding-block: 48px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .mpage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 610 / 700; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 6px var(--cover), 0 24px 50px rgba(0,0,0,.55); }
    .mpage .page { position: absolute; left: 0; top: 0; transform-origin: 0 0; border-radius: 0; background: var(--paper); padding-left: 52px; }
  }
  @media (prefers-reduced-motion: reduce) { .stamp.pending > svg { opacity: 1; } }
</style>

<section aria-labelledby="work-title">
  <div class="track" id="track">
    <div class="stage">
      <div class="glow"></div>
      <div class="head"><h2 id="work-title"></h2><p class="sub"></p></div>

    </div>
  </div>
  <div class="stack" id="stack"><div class="head"><h2></h2><p class="sub"></p></div></div>
</section>

    tiles: `<rect x="-16" y="-16" width="14" height="14" rx="2"/><rect x="2" y="-16" width="14" height="14" rx="2"/><rect x="-16" y="2" width="14" height="14" rx="2"/><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" stroke="none"/>`,
    layers: `<path d="M0 -15 L16 -7 L0 1 L-16 -7 Z M-16 0 L0 8 L16 0 M-16 7 L0 15 L16 7"/>`,
    pipe: `<circle cx="-13" r="4.5"/><circle r="4.5"/><circle cx="13" r="4.5" fill="currentColor"/><path d="M-8.5 0 H-4.5 M4.5 0 H8.5 M-13 -10 C -6 -16 6 -16 13 -10 M10 -13 L13 -10 L10 -7"/>`,
    rings: `<circle r="16"/><circle r="10.5"/><circle r="5"/><circle r="1.6" fill="currentColor" stroke="none"/>`,
    chat: `<path d="M-16 -13 H5 V2 H-6 L-12 8 V2 H-16 Z"/><path d="M9 -5 H16 V10 H13 V15 L8 10 H-2 V6"/>`,
    gear: `<circle r="6"/>${[0,1,2,3,4,5,6,7].map(i => `<path d="M0 -11 V-16" transform="rotate(${i*45})"/>`).join("")}<circle r="11"/>`,
    doc: `<path d="M-12 -17 H6 L13 -10 V17 H-12 Z M6 -17 V-10 H13"/><circle cx="-4" cy="-1" r="2.5"/><circle cx="5" cy="9" r="2.5"/><path d="M6 -3 L-5 11"/>`,
    sigma: `<path d="M13 -15 H-12 L2 0 L-12 15 H13" stroke-linejoin="round"/>`,
    scale: `<path d="M0 -16 V14 M-9 15 H9 M-15 -9 H15 M-15 -9 L-20 3 H-10 Z M15 -9 L10 3 H20 Z"/>`,
    globe: `<circle r="15"/><ellipse rx="6.5" ry="15"/><path d="M-15 0 H15 M-13 -7 H13 M-13 7 H13"/>`,
    check: `<rect x="-14" y="-16" width="28" height="32" rx="3"/><path d="M-8 -7 l3 3 l5 -6 M-8 4 l3 3 l5 -6 M4 -5 H9 M4 6 H9"/>`,
    sparkle: `<path d="M-2 -16 C -1 -6 -6 -2 -16 -1 C -6 0 -1 4 -2 14 C -1 4 4 0 12 -1 C 4 -2 -1 -6 -2 -16 Z"/><path d="M12 8 V17 M7.5 12.5 H16.5"/>`,
    phone: `<rect x="-10" y="-17" width="20" height="34" rx="4"/><path d="M-4 12 H4"/><rect x="-6" y="-11" width="12" height="16" rx="1.5" fill="currentColor" stroke="none" opacity=".45"/>`,
    mentor: `<circle cx="-7" cy="-9" r="5.5"/><path d="M-17 15 C -17 4 3 4 3 15"/><circle cx="10" cy="-3" r="4"/><path d="M3 15 C 3 8 17 8 17 15"/>`,
    store: `<path d="M-16 -6 L-12 -15 H12 L16 -6 Z M-16 -6 C -16 -1 -8 -1 -8 -6 C -8 -1 0 -1 0 -6 C 0 -1 8 -1 8 -6 C 8 -1 16 -1 16 -6 M-13 -1 V15 H13 V-1 M-4 15 V6 H4 V15"/>`,
    coin: `<circle r="15"/><circle r="11"/><path d="M4 -5 C 2 -8 -5 -8 -5 -4 C -5 0 5 -1 5 4 C 5 8 -2 8 -4 5 M0 -10 V10"/>`,
    team: `<circle cy="-9" r="5" fill="currentColor"/><circle cx="-12" cy="-4" r="4"/><circle cx="12" cy="-4" r="4"/><path d="M-8 12 a8 8 0 0 1 16 0 M-19 13 a7 7 0 0 1 12 -4 M7 9 a7 7 0 0 1 12 4"/>`
  };
  // Big icons for the main stamps (drawn at stamp scale).
  const BIG = {
    clouds: `<g stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-210,-200)">
      <path d="M130 172 a16 16 0 0 1 14 -22 a20 20 0 0 1 36 -2 a14 14 0 0 1 12 24 z"/><path d="M186 140 a16 16 0 0 1 14 -22 a20 20 0 0 1 36 -2 a14 14 0 0 1 12 24 z"/><path d="M242 172 a16 16 0 0 1 14 -22 a20 20 0 0 1 36 -2 a14 14 0 0 1 12 24 z"/>
      <path d="M162 184 C 170 206 196 214 210 222 M218 152 L 210 222 M262 184 C 254 206 224 214 210 222"/><path d="M210 222 V 262"/>
      <rect x="172" y="262" width="76" height="34" rx="6" fill="currentColor"/><path d="M196 279 l10 9 l18 -18" stroke="#EFE5CF"/></g>`,
    calendar: `<g stroke-width="5" transform="scale(.8) translate(-210,-196)">
      <rect x="128" y="128" width="164" height="136" rx="10"/><path d="M128 158 H292"/><path d="M160 116 v22 M260 116 v22" stroke-width="6" stroke-linecap="round"/>
      <g fill="currentColor" stroke="none">${[0,1,2].map(r => [0,1,2,3].map(c => `<rect x="${142+c*38}" y="${172+r*28}" width="26" height="18" rx="3" opacity="${r===1&&c===2?1:.35}"/>`).join("")).join("")}</g>
      <path d="M92 252 H170 l12 -26 l16 50 l16 -62 l14 38 H328" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></g>`,
    tap: `<g stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-212,-147)">
      <rect x="112" y="104" width="128" height="86" rx="10"/><rect x="128" y="124" width="26" height="20" rx="3" fill="currentColor"/><path d="M128 168 H190"/>
      <path d="M268 122 a40 40 0 0 1 0 50 M290 108 a62 62 0 0 1 0 78 M312 94 a84 84 0 0 1 0 106"/></g>`,
    team: `<g stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-220,-150)">
      <path d="M150 116 L118 150 L150 184 M290 116 L322 150 L290 184"/><circle cx="220" cy="128" r="12" fill="currentColor"/><circle cx="186" cy="140" r="9"/><circle cx="254" cy="140" r="9"/>
      <path d="M196 176 a24 24 0 0 1 48 0 M164 182 a20 20 0 0 1 36 -10 M240 172 a20 20 0 0 1 36 10"/></g>`
  };
  const bigIcon = (name, x, y, scale = 2.6) => BIG[name] ? `<g transform="translate(${x},${y})">${BIG[name]}</g>`
    : `<g transform="translate(${x},${y}) scale(${scale})" stroke-width="${(5 / scale).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">${ICON[name] || ""}</g>`;
  const smallIcon = (name, x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ICON[name] || ""}</g>`;

  const T = (x, y, size, weight, spacing, text) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="${weight}" letter-spacing="${spacing}" fill="currentColor" stroke="none">${esc(text)}</text>`;
  const arc = (id, d, size, weight, spacing, text) => `<path id="${id}" d="${d}" fill="none" stroke="none"/><text font-size="${size}" font-weight="${weight}" letter-spacing="${spacing}" fill="currentColor" stroke="none"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${esc(text)}</textPath></text>`;
  // Split a phrase into one or two balanced lines.
  function wrap(text, max) {
    if (text.length <= max) return [text];
    const w = text.split(" "); let best = [text], score = 1e9;
    for (let i = 1; i < w.length; i++) { const a = w.slice(0, i).join(" "), b = w.slice(i).join(" "); const s = Math.max(a.length, b.length); if (s < score) { score = s; best = [a, b]; } }
    return best;
  }
  const textW = (lines, cw) => Math.max(...lines.map(l => l.length)) * cw;

  // ---------- Main stamps ----------
  const MAIN = {
    circle: (s, k) => ({ w: 420, h: 420, body: `<circle cx="210" cy="210" r="196" stroke-width="9"/><circle cx="210" cy="210" r="180" stroke-width="3"/>
      ${s.top ? arc(k + "t", "M62 210 A148 148 0 0 1 358 210", 26, 600, 5, s.top) : ""}${s.bottom ? arc(k + "b", "M38 210 A172 172 0 0 0 382 210", 24, 700, 6, s.bottom) : ""}
      <circle cx="44" cy="210" r="5" fill="currentColor" stroke="none"/><circle cx="376" cy="210" r="5" fill="currentColor" stroke="none"/>${bigIcon(s.icon, 210, 210)}` }),
    hex: (s, k) => ({ w: 420, h: 420, body: `<polygon points="210,14 380,112 380,308 210,406 40,308 40,112" stroke-width="9" stroke-linejoin="round"/><polygon points="210,32 364,121 364,299 210,388 56,299 56,121" stroke-width="3" stroke-linejoin="round"/>
      ${s.top ? arc(k + "t", "M84 214 A126 126 0 0 1 336 214", 23, 600, 5, s.top) : ""}${bigIcon(s.icon, 210, 196)}
      ${(s.lines || []).map((t, i) => T(210, 304 + i * 30, i ? 18 : 24, i ? 500 : 700, i ? 4 : 5, t)).join("")}` }),
    octa: (s, k) => ({ w: 420, h: 420, body: `<polygon points="130,14 290,14 406,130 406,290 290,406 130,406 14,290 14,130" stroke-width="9" stroke-linejoin="round"/><polygon points="137,32 283,32 388,137 388,283 283,388 137,388 32,283 32,137" stroke-width="3" stroke-linejoin="round"/>
      ${T(210, 112, 28, 700, 6, s.top || "")}${bigIcon(s.icon, 210, 186, 2.6)}
      ${(s.lines || []).map((t, i) => T(210, 300 + i * 34, i ? 19 : 26, i ? 500 : 700, i ? 4 : 5, t)).join("")}` }),
    rect: (s) => ({ w: 460, h: 320, body: `<rect x="10" y="10" width="440" height="300" rx="36" stroke-width="9"/><rect x="28" y="28" width="404" height="264" rx="24" stroke-width="3"/>
      ${T(230, 82, 38, 700, 12, (s.lines || [])[0] || "")}${bigIcon(s.icon, 214, 150)}
      ${(s.lines || []).slice(1).map((t, i) => T(230, 236 + i * 34, i ? 19 : 26, i ? 500 : 700, i ? 5 : 7, t)).join("")}` }),
    tri: (s) => ({ w: 400, h: 370, body: `<polygon points="200,14 388,350 12,350" stroke-width="9" stroke-linejoin="round"/><polygon points="200,46 360,332 40,332" stroke-width="3" stroke-linejoin="round"/>
      ${bigIcon(s.icon, 200, 156, 2.4)}${(s.lines || []).map((t, i) => T(200, 240 + i * 30 + (i ? 4 : 0), i ? 17 : 32, i ? 600 : 700, i ? 3 : 8, t)).join("")}` }),
    oval: (s, k) => ({ w: 440, h: 300, body: `<ellipse cx="220" cy="150" rx="208" ry="138" stroke-width="9"/><ellipse cx="220" cy="150" rx="190" ry="120" stroke-width="3"/>
      ${s.top ? arc(k + "t", "M70 150 A150 92 0 0 1 370 150", 26, 600, 7, s.top) : ""}${s.bottom ? arc(k + "b", "M40 150 A180 112 0 0 0 400 150", 19, 600, 5, s.bottom) : ""}
      ${bigIcon(s.icon, 220, 140)}${(s.lines || []).map((t, i) => T(220, 206 + i * 28, 24, 700, 7, t)).join("")}` })
  };

  // ---------- Small skill stamps ----------
  const CW = 12.4; // average width per character at 18px Oswald with tracking
  const SMALL = {
    pill: (s) => { const L = wrap(s.text, 16), tw = textW(L, CW), w = Math.round(tw + 92), h = L.length > 1 ? 84 : 62;
      return { w, h, body: `<rect x="3" y="3" width="${w - 6}" height="${h - 6}" rx="${(h - 6) / 2}" stroke-width="5"/><rect x="10" y="10" width="${w - 20}" height="${h - 20}" rx="${(h - 20) / 2}" stroke-width="1.6"/>
        ${smallIcon(s.icon, 38, h / 2, .82)}${L.map((t, i) => T(64 + tw / 2, h / 2 + 7 + (i - (L.length - 1) / 2) * 22, 18, 700, 2.5, t)).join("")}` }; },
    ribbon: (s) => { const L = wrap(s.text, 18), tw = textW(L, CW), w = Math.round(tw + 104), h = L.length > 1 ? 82 : 60;
      return { w, h, body: `<path d="M3 3 H${w - 3} L${w - 20} ${h / 2} L${w - 3} ${h - 3} H3 L20 ${h / 2} Z" stroke-width="4.5" stroke-linejoin="round"/>
        ${smallIcon(s.icon, 44, h / 2, .78)}${L.map((t, i) => T(70 + tw / 2, h / 2 + 7 + (i - (L.length - 1) / 2) * 22, 18, 700, 2.5, t)).join("")}` }; },
    square: (s) => { const L = wrap(s.text, 11), w = Math.max(150, Math.round(textW(L, 11.6) + 36)), h = 156;
      return { w, h, body: `<rect x="3" y="3" width="${w - 6}" height="${h - 6}" rx="6" stroke-width="5"/><rect x="11" y="11" width="${w - 22}" height="${h - 22}" rx="3" stroke-width="1.6"/>
        ${smallIcon(s.icon, w / 2, 56, 1.15)}${L.map((t, i) => T(w / 2, 108 + i * 22, 16, 700, 2, t)).join("")}` }; },
    seal: (s) => { const L = wrap(s.text, 12), d = 164, c = d / 2;
      return { w: d, h: d, body: `<circle cx="${c}" cy="${c}" r="${c - 4}" stroke-width="5"/><circle cx="${c}" cy="${c}" r="${c - 12}" stroke-width="1.6" stroke-dasharray="2 4"/>
        ${smallIcon(s.icon, c, 62, 1.05)}${L.map((t, i) => T(c, 108 + i * 20, 15, 700, 1.8, t)).join("")}` }; },
    oct: (s) => { const L = wrap(s.text, 11), w = 160, h = 160, a = 46;
      return { w, h, body: `<polygon points="${a},3 ${w - a},3 ${w - 3},${a} ${w - 3},${h - a} ${w - a},${h - 3} ${a},${h - 3} 3,${h - a} 3,${a}" stroke-width="5" stroke-linejoin="round"/>
        ${smallIcon(s.icon, w / 2, 58, 1.1)}${L.map((t, i) => T(w / 2, 106 + i * 21, 15.5, 700, 1.8, t)).join("")}` }; },
    dash: (s) => { const L = wrap(s.text, 14), tw = textW(L, CW), w = Math.round(tw + 44), h = 112;
      return { w, h, body: `<rect x="3" y="3" width="${w - 6}" height="${h - 6}" rx="8" stroke-width="3.5" stroke-dasharray="10 6"/>
        ${smallIcon(s.icon, w / 2, 32, .8)}${L.map((t, i) => T(w / 2, 70 + i * 22, 18, 700, 2.5, t)).join("")}` }; }
  };

  function stampEl(s, isMain, scale = 1) {
    const k = "st" + (uid++), f = (isMain ? MAIN[s.shape] : SMALL[s.kind])(s, k);
    const words = [s.top, ...(s.lines || []), s.text, s.bottom].filter(Boolean).join(", ");
    const el = document.createElement("div");
    el.className = "stamp" + (isMain ? " main" : "") + (reduce ? "" : " pending");
    const w = isMain ? s.w : f.w * scale;
    el.style.cssText = `left:${s.x}px; top:${s.y}px; width:${w}px; transform: rotate(${s.rot || 0}deg);`;
    el.dataset.rot = s.rot || 0; el.dataset.w = w; el.dataset.h = w * f.h / f.w;
    el.innerHTML = `<svg viewBox="-6 -6 ${f.w + 12} ${f.h + 12}" role="img" aria-label="${esc(words)}"><g filter="url(#${isMain ? "ink" + (uid % 3) : "inkS"})" fill="none" stroke="${s.ink}" color="${s.ink}" font-family="Oswald, 'Arial Narrow', sans-serif">${f.body}</g></svg>`;
    const round = isMain ? /circle|oval|hex|octa/.test(s.shape) : /seal|oct/.test(s.kind);
    const press = document.createElement("div"); press.className = "press"; press.style.setProperty("--pr", round ? "50%" : "14px"); el.prepend(press);
    el.addEventListener("click", () => land1(el, 0, null, isMain));   // tap a stamp to stamp it again
    return el;
  }

  // Small stamps find their own spots: a jittered grid that steps around the big stamp.
  function rng(seed) { let s = seed * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
  function placeSkills(page, p) {
    const R = rng(p.seed || 1), m = p.main, mh = m.w * (m.shape === "rect" ? 320 / 460 : m.shape === "oval" ? 300 / 440 : m.shape === "tri" ? 370 / 400 : 1);
    const right = page.classList.contains("r"), minX = right ? 50 : 22, maxX = right ? 590 : 560;
    const top = p.city ? 108 : 34, placed = [{ x: m.x + 8, y: m.y + 8, w: m.w - 16, h: mh - 16 }];
    // Candidate spots on a fine grid, visited in a seeded order so every page looks hand-stamped.
    const cand = [];
    for (let r = 0; r < 9; r++) for (let c = 0; c < 7; c++) cand.push({ cx: 60 + c * 82, cy: top + 36 + r * ((664 - top - 36) / 8), k: R() });
    cand.sort((a, b) => a.k - b.k);
    const overlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
    p.skills.forEach(s => {
      const el = stampEl(Object.assign({}, s, { x: 0, y: 0, rot: Math.round((R() - .5) * 20) }), false, .86);
      const w = +el.dataset.w, h = +el.dataset.h;
      let best = null, bestCost = Infinity;
      for (const c of cand) {
        const x = Math.max(minX, Math.min(maxX - w, c.cx - w / 2 + (R() - .5) * 12));
        const y = Math.max(top - 4, Math.min(680 - h, c.cy - h / 2 + (R() - .5) * 10));
        const box = { x: x + 2, y: y + 2, w: w - 4, h: h - 4 };
        const cost = placed.reduce((t, b) => t + overlap(box, b), 0);
        if (cost < bestCost) { best = { x, y, box }; bestCost = cost; if (cost === 0) break; }
      }
      placed.push(best.box);
      el.style.left = best.x + "px"; el.style.top = best.y + "px";
      page.appendChild(el);
    });
  }

  // Security paper: fine waves across the page and a rosette watermark, drawn once and reused on every page.
  const SECURITY = (() => {
    let d = "";
    for (let y = 30; y < 700; y += 16) { let q = `M-10 ${y}`; for (let x = -10; x <= 620; x += 20) q += ` L${x} ${(y + Math.sin((x + y * 1.7) / 38) * 5).toFixed(1)}`; d += `<path d="${q}"/>`; }
    let r = "";
    for (let k = 0; k < 9; k++) { const R0 = 70 + k * 18; let q = ""; for (let i = 0; i <= 180; i++) { const a = i / 180 * Math.PI * 2, rr = R0 + Math.sin(a * 12 + k) * 6; q += (i ? " L" : "M") + (305 + rr * Math.cos(a)).toFixed(1) + " " + (390 + rr * Math.sin(a)).toFixed(1); } r += `<path d="${q} Z"/>`; }
    return `<svg class="security" viewBox="0 0 610 700" aria-hidden="true"><g fill="none" stroke="#B49B6E" stroke-width=".7" stroke-opacity=".28">${d}</g><g fill="none" stroke="#B49B6E" stroke-width=".9" stroke-opacity=".22">${r}</g></svg>`;
  })();
  const EMBLEM = `<svg class="emblem" viewBox="-120 -120 240 240" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
    <circle r="78"/><ellipse rx="34" ry="78"/><ellipse rx="64" ry="78"/><path d="M-78 0 H78 M-70 -36 H70 M-70 36 H70"/>
    <ellipse rx="112" ry="38" transform="rotate(-24)" stroke-width="1.8"/><circle cx="96" cy="-60" r="7" fill="currentColor" stroke="none"/>
    <path d="M0 -104 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="currentColor" stroke="none"/></svg>`;
  const CHIP = `<svg class="chip" viewBox="0 0 52 32" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="1.5" y="1.5" width="49" height="29" rx="5"/><path d="M1.5 12 H17 M1.5 20 H17 M35 12 H50.5 M35 20 H50.5"/><circle cx="26" cy="16" r="6"/></svg>`;
  function coverEl() {
    const el = document.createElement("div"); el.className = "page coverfront";
    el.innerHTML = `<div class="frame"></div><div class="word">PASSPORT</div>${EMBLEM}<div class="name">${esc(CONTENT.owner)}</div><div class="role">${esc(CONTENT.role)}</div>${CHIP}`;
    return el;
  }
  function pageEl(p, side) {
    const el = document.createElement("div");
    if (p === "INSIDE") { el.className = "page inside"; el.innerHTML = `<div class="frame" style="position:absolute; inset:28px; border:1px solid rgba(207,174,99,.25); border-radius:10px"></div>`; return el; }
    el.className = "page " + side;
    el.innerHTML = SECURITY + `<span class="visas">VISAS</span>` + (p && p.city ? `<h3>${esc(p.city)}</h3>` : "");
    if (!p || p === "BLANK") return el;
    el.appendChild(stampEl(p.main, true));
    placeSkills(el, p);
    return el;
  }

  // ---------- The thump ----------
  // The big stamp drops, presses and settles; the book gives a little. Skills follow in a quick run.
  // A rubber stamp falls toward the page (its shadow tightens and darkens), the ink appears at contact with a small squish,
  // then the stamp lifts away and the book gives a little.
  const APPROACH = { main: 300, small: 220 }, STEP = { main: 560, small: 190 };
  function land1(el, d, book, isMain) {
    el.classList.remove("pending");
    if (reduce) return;
    const svg = el.querySelector("svg"), press = el.querySelector(".press"), a = isMain ? APPROACH.main : APPROACH.small;
    press.animate([
      { opacity: 0, transform: "translate(18px, 26px) scale(1.22)", filter: "blur(18px)", easing: "cubic-bezier(0.55, 0, 1, 0.45)" },
      { opacity: .55, transform: "translate(0, 0) scale(1)", filter: "blur(4px)", offset: .55, easing: "cubic-bezier(0.23, 1, 0.32, 1)" },
      { opacity: 0, transform: "translate(10px, 16px) scale(1.12)", filter: "blur(14px)" }
    ], { duration: a / .55, delay: d, fill: "backwards" });
    svg.animate([
      { opacity: 0, transform: "scale(1.04)" },
      { opacity: 1, transform: "scale(0.975)", offset: .3 },
      { opacity: 1, transform: "scale(1)" }
    ], { duration: isMain ? 340 : 260, delay: d + a, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "backwards" });
    if (book) book.animate([{ translate: "0 0" }, { translate: `0 ${isMain ? 5 : 2}px` }, { translate: "0 0" }], { duration: isMain ? 240 : 160, delay: d + a, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });
  }
  function land(page, delay0, book) {
    const main = page.querySelector(".stamp.main.pending"), small = [...page.querySelectorAll(".stamp:not(.main).pending")];
    if (main) land1(main, delay0, book, true);
    const start = delay0 + (main ? STEP.main : 0);
    small.forEach((el, i) => land1(el, start + i * STEP.small, book, false));
    return (main ? STEP.main : 0) + small.length * STEP.small;
  }

  // ---------- Build ----------
  // The book opens on the inside of the cover and the first city; the last page stays blank for the next stamp.
  const P = ["INSIDE", ...CONTENT.pages]; if (P.length % 2) P.push("BLANK");
  const N = P.length / 2;
  document.querySelectorAll("h2").forEach(h => h.textContent = CONTENT.title);
  document.querySelectorAll(".sub").forEach(p => p.textContent = CONTENT.sub);

  const book = document.getElementById("book"), track = document.getElementById("track"), room = book.parentElement;
  const rim = document.createElement("div"); rim.className = "rim leather"; book.appendChild(rim);
  const stackR = document.createElement("div"); stackR.className = "stackp r"; book.appendChild(stackR);
  const stackL = document.createElement("div"); stackL.className = "stackp l"; book.appendChild(stackL);
  const els = [];
  els[2 * N - 1] = pageEl(P[2 * N - 1], "r"); els[2 * N - 1].classList.add("base-right"); book.appendChild(els[2 * N - 1]);
  const castR = document.createElement("div"); castR.className = "cast"; castR.style.cssText = "left:610px; width:610px; background: linear-gradient(90deg, rgba(30,22,10,.42), rgba(30,22,10,0) 75%); border-radius: 0 14px 14px 0;"; book.appendChild(castR);
  const castL = document.createElement("div"); castL.className = "cast"; castL.style.cssText = "left:0; width:610px; background: linear-gradient(270deg, rgba(30,22,10,.42), rgba(30,22,10,0) 75%); border-radius: 14px 0 0 14px;"; book.appendChild(castL);
  const leaves = [];
  for (let k = 0; k < N; k++) {
    const leaf = document.createElement("div"); leaf.className = "leaf" + (k ? "" : " coverleaf");
    const front = document.createElement("div"); front.className = "face front";
    const back = document.createElement("div"); back.className = "face back";
    if (k === 0) { front.appendChild(coverEl()); els[0] = pageEl("INSIDE"); back.appendChild(els[0]); }
    else { els[2 * k - 1] = pageEl(P[2 * k - 1], "r"); els[2 * k] = pageEl(P[2 * k], "l"); front.appendChild(els[2 * k - 1]); back.appendChild(els[2 * k]); }
    const s1 = document.createElement("div"); s1.className = "shade"; s1.style.background = "linear-gradient(90deg, rgba(43,36,24,.45), rgba(43,36,24,.08) 45%, rgba(255,250,235,.10) 80%, rgba(43,36,24,0))"; front.appendChild(s1);
    const s2 = document.createElement("div"); s2.className = "shade"; s2.style.background = "linear-gradient(270deg, rgba(43,36,24,.45), rgba(43,36,24,.08) 45%, rgba(255,250,235,.10) 80%, rgba(43,36,24,0))"; back.appendChild(s2);
    leaf.append(front, back); book.appendChild(leaf); leaves.push({ leaf, s1, s2 });
  }
  track.style.height = `calc(100vh + ${N * 110}vh)`;

  let S = 1;
  function fit() { const r = room.getBoundingClientRect(); S = Math.min(r.width / 1270, r.height / 770); }
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const clamp = v => Math.max(0, Math.min(1, v));
  let target = 0, cur = 0; const landed = new Set();
  // Each spread holds still for a while, then the page turns: scroll maps to stops with a pause at each one.
  function read() {
    const max = track.offsetHeight - innerHeight, p = max > 0 ? clamp(-track.getBoundingClientRect().top / max) : 0;
    const x = p * N, i = Math.floor(x), f = x - i;
    target = Math.min(N, i + clamp((f - .2) / .55));
  }
  function render() {
    let castRight = 0, castLeft = 0;
    const open = ease(clamp(cur));
    // Closed, the cover sits centered; as it opens the book slides over to show both pages.
    book.style.transform = `translate(-50%, -50%) scale(${S}) rotateX(8deg) rotateZ(-1.2deg) translateX(${-305 * (1 - open)}px)`;
    stackL.style.opacity = open > .5 ? 1 : 0;
    leaves.forEach((L, k) => {
      const t = ease(clamp(cur - k)), sh = Math.sin(Math.PI * t);
      L.leaf.style.transform = `translateZ(${sh * 26}px) rotateY(${-180 * t}deg)`;
      L.leaf.style.zIndex = t > .5 ? 10 + k : 10 + N - k;
      L.s1.style.opacity = t < .5 ? sh * (k ? 1 : .5) : 0; L.s2.style.opacity = t >= .5 ? sh * (k ? 1 : .5) : 0;
      if (t > 0 && t < 1) { if (t < .5) castRight = Math.max(castRight, sh); else castLeft = Math.max(castLeft, sh); }
      if (clamp(cur - k) > .96 && !landed.has(k)) { landed.add(k); const t1 = land(els[2 * k], 60, book); land(els[2 * k + 1], 60 + t1 * .5, book); }
    });
    castR.style.opacity = castRight * .9; castL.style.opacity = castLeft * .9 * (open > .5 ? 1 : 0);
    castR.style.zIndex = castL.style.zIndex = 9;
  }
  function frame() { cur += (target - cur) * (reduce ? 1 : 0.1); if (Math.abs(target - cur) < 0.0005) cur = target; render(); requestAnimationFrame(frame); }
  addEventListener("scroll", read, { passive: true });
  addEventListener("resize", () => { fit(); read(); });
  fit(); read(); cur = target; requestAnimationFrame(frame);

  // ---------- Phones: the pages one under another; each gets its stamps as it scrolls in ----------
  const stack = document.getElementById("stack");
  const mobile = CONTENT.pages.map(p => { const box = document.createElement("div"); box.className = "mpage"; const pg = pageEl(p, "r"); box.appendChild(pg); stack.appendChild(box); return { box, pg }; });
  const mfit = () => mobile.forEach(m => m.pg.style.transform = `scale(${m.box.clientWidth / 610})`);
  addEventListener("resize", mfit); mfit();
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const m = mobile.find(m => m.box === e.target); land(m.pg, 120, null); io.unobserve(e.target); } }), { threshold: 0.4 });
  mobile.forEach(m => io.observe(m.box));
})();
</script>
