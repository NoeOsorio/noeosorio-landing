<script>
(() => {
  const C = CONTENT, esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, E = "cubic-bezier(0.23, 1, 0.32, 1)";
  const LOGO_PATHS = '<path d="M123 111 L225 111 L250 154 L225 198 L199 155 L150 155 L123 198 L147 243 L97 243 L72 199 Z"/><path d="M252 156 L302 156 L327 200 L276 288 L175 288 L149 244 L174 200 L200 244 L250 244 L276 200 Z"/>';

  // ---------- The ask ----------
  const CUP = '<svg class="cup" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11 H21 V18 A6 6 0 0 1 15 24 H11 A6 6 0 0 1 5 18 Z M21 13 H23.5 A3 3 0 0 1 23.5 19 H21 M10 4 C 9 6 11 7 10 9 M15 4 C 14 6 16 7 15 9"/></svg>';

    '<svg class="cup" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 9 L5 15 L11 21 M19 9 L25 15 L19 21 M17 6 L13 24"/></svg>'];
  vAsk.innerHTML = `<div class="merchant"><svg viewBox="60 100 280 200" fill="var(--screen-ink)" aria-hidden="true">${LOGO_PATHS}</svg><div><b>${esc(C.merchant)}</b><span>${esc(C.place)}</span></div></div><div class="bill"><span>${esc(C.receiptLine)}</span><i></i><span>${esc(C.total)}</span></div>
    <h2 class="ask">${esc(C.ask)}</h2><p class="askSub">${esc(C.askSub)}</p>
    <div class="tips">${C.tips.map((t, i) => `<a class="tip${i ? "" : " hero"}" href="${esc(C.jar)}" target="_blank" rel="noopener" data-i="${i}">${ICONS[i] || ""}<span class="price">${esc(t.price)}</span><span class="name">${esc(t.name)}</span><span class="line">${esc(t.line)}</span></a>`).join("")}</div>
    <button class="notip" type="button">${esc(C.noTip)}</button>`;
  vAsk.querySelectorAll(".tip").forEach(a => a.addEventListener("click", e => { e.preventDefault(); paid(C.tips[+a.dataset.i]); }));
  vAsk.querySelector(".notip").addEventListener("click", judged);

  // ---------- Paying: the frame, my logo drawing itself, the check ----------
  function paid(t) {
    vPay.innerHTML = `<svg viewBox="-60 -60 120 120" fill="none" aria-hidden="true">
        <g class="frame" stroke="var(--lime-deep)" stroke-width="4.5" stroke-linecap="round"><path d="M-52 -26 V-40 A12 12 0 0 1 -40 -52 H-26"/><path d="M26 -52 H40 A12 12 0 0 1 52 -40 V-26"/><path d="M52 26 V40 A12 12 0 0 1 40 52 H26"/><path d="M-26 52 H-40 A12 12 0 0 1 -52 40 V26"/></g>
        <g class="logo" transform="scale(.31) translate(-200,-200)" stroke="var(--lime-deep)" stroke-width="7" stroke-linejoin="round">${LOGO_PATHS.replace(/<path /g, '<path class="lp" ')}</g>
        <path class="check" d="M-20 2 L-5 17 L22 -14" stroke="var(--lime-deep)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg>
      <h3>${esc(C.thanks)}</h3><p>${esc(t.after)}</p>
      <div class="going"><span>${esc(C.openingJar)}</span><i><b></b></i></div>
      <a class="ghost jar" href="${esc(C.jar)}" target="_blank" rel="noopener" hidden>${esc(C.openJar)}</a>`;
    show(vPay);
    const going = vPay.querySelector(".going"), bar = going.querySelector("b"), jarBtn = vPay.querySelector(".jar");
    // After the thanks, a short bar fills and the page goes to the tip jar. If the browser blocks it, the button stays.
    const go = () => { try { location.assign(C.jar); } catch (e) {} setTimeout(() => { going.hidden = true; jarBtn.hidden = false; }, 700); };
    if (reduce) { vPay.querySelector(".check").setAttribute("opacity", 1); vPay.querySelector(".logo").setAttribute("opacity", 0); later(1200, go); return; }
    const frame = vPay.querySelector(".frame"), logo = vPay.querySelector(".logo"), check = vPay.querySelector(".check"), lps = [...vPay.querySelectorAll(".lp")];
    const words = [vPay.querySelector("h3"), vPay.querySelector("p"), going];
    words.forEach(w => w.style.opacity = 0);
    lps.forEach(l => { const L = l.getTotalLength(); l.style.strokeDasharray = L; l.style.strokeDashoffset = L; l.style.fill = "transparent"; });
    check.style.strokeDasharray = 60; check.style.strokeDashoffset = 60;
    frame.animate([{ transform: "scale(1.25)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 360, easing: E, fill: "both" });
    lps.forEach((l, i) => l.animate([{ strokeDashoffset: l.style.strokeDasharray }, { strokeDashoffset: 0 }], { duration: 600, delay: 160 + i * 150, easing: "cubic-bezier(0.65, 0, 0.35, 1)", fill: "forwards" }));

    check.animate([{ opacity: 0, strokeDashoffset: 60 }, { opacity: 1, strokeDashoffset: 60, offset: .01 }, { opacity: 1, strokeDashoffset: 0 }], { duration: 300, delay: 1280, easing: E, fill: "forwards" });

    words.forEach((w, i) => w.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 320, delay: 1500 + i * 90, easing: E, fill: "forwards" }));
    bar.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 1500, delay: 1900, easing: "cubic-bezier(0.65, 0, 0.35, 1)", fill: "forwards" });
    later(3500, go);
  }

  // ---------- No tip: the terminal takes it personally ----------
  function judged() {
    vJudge.innerHTML = `<div class="slipwrap"><div class="slip">TIP ............ $0.00</div><span class="noted">${esc(C.stamp)}</span></div>
      ${C.judged.map((l, i) => `<p class="say${i === C.judged.length - 1 ? " small" : ""}">${esc(l)}</p>`).join("")}
      <div class="last"><h3>${esc(C.subscribeAsk)}</h3><div class="row">
        <a class="yt" href="${esc(C.youtube)}" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5 L19 12 L8 19 Z"/></svg>${esc(C.subscribe)}</a>
        <button class="ghost" type="button" style="margin-top:0">${esc(C.changedMind)}</button></div></div>`;
    vJudge.querySelector(".ghost").addEventListener("click", () => show(vAsk));
    show(vJudge);
    if (reduce) return;
    const stamp = vJudge.querySelector(".noted"), says = [...vJudge.querySelectorAll(".say")], last = vJudge.querySelector(".last");
    vJudge.querySelector(".slipwrap").animate([{ transform: "translateY(-30px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 420, easing: E, fill: "both" });
    stamp.animate([{ opacity: 0, transform: "rotate(-4deg) scale(1.5)" }, { opacity: 1, transform: "rotate(-12deg) scale(.96)", offset: .6 }, { opacity: 1, transform: "rotate(-12deg) scale(1)" }], { duration: 380, delay: 520, easing: E, fill: "forwards" });
    // Long, awkward pauses between lines: that's the joke.
    const beats = [1300, 2400, 3700, 5300];
    says.forEach((s, i) => s.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 320, delay: beats[i], easing: E, fill: "forwards" }));
    last.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 360, delay: 6500, easing: E, fill: "forwards" });
  }

  // ---------- Robots only ----------

  const RB = C.robot, robot = document.getElementById("robot"), term = document.getElementById("term");
  robot.innerHTML = `<button class="box" type="button" aria-label="${esc(RB.check)}"></button><div><div class="lab">${esc(RB.check)}</div><div class="msg" aria-live="polite"></div></div>
    <div class="brand"><canvas width="34" height="25" aria-hidden="true"></canvas>${esc(RB.title)}</div>`;
  { const cv = robot.querySelector("canvas"), x = cv.getContext("2d"); x.fillStyle = "#C6F06B"; x.save(); x.scale(34 / 280, 25 / 200); x.translate(-60, -100);
    x.fill(new Path2D("M123 111 L225 111 L250 154 L225 198 L199 155 L150 155 L123 198 L147 243 L97 243 L72 199 Z M252 156 L302 156 L327 200 L276 288 L175 288 L149 244 L174 200 L200 244 L250 244 L276 200 Z")); x.restore(); }
  let travel = 0, lx = null, ly = null;
  addEventListener("pointermove", e => { if (lx !== null) travel += Math.hypot(e.clientX - lx, e.clientY - ly); lx = e.clientX; ly = e.clientY; }, { passive: true });
  // My logo as ASCII, drawn from the same shape as everywhere else.
  function asciiLogo(cols = 34, rows = 12) {
    const c = document.createElement("canvas"); c.width = cols; c.height = rows * 2; const x = c.getContext("2d");
    x.save(); const k = Math.min(cols / 270, rows * 2 / 190); x.translate(cols / 2, rows); x.scale(k, k); x.translate(-200, -200);
    x.fill(new Path2D("M123 111 L225 111 L250 154 L225 198 L199 155 L150 155 L123 198 L147 243 L97 243 L72 199 Z M252 156 L302 156 L327 200 L276 288 L175 288 L149 244 L174 200 L200 244 L250 244 L276 200 Z")); x.restore();
    const d = x.getImageData(0, 0, cols, rows * 2).data, on = (i, j) => d[(j * cols + i) * 4 + 3] > 100; let out = "";
    for (let j = 0; j < rows; j++) { let line = ""; for (let i = 0; i < cols; i++) { const t = on(i, j * 2), b = on(i, j * 2 + 1); line += t && b ? "█" : t ? "▀" : b ? "▄" : " "; } out += line.replace(/\s+$/, "") + "\n"; }
    return out.replace(/^\n+|\n+$/g, "");
  }
  const hl = line => {
    let h = esc(line);
    if (/^# /.test(line)) return `<span class="h1">${h}</span>`;
    if (/^## /.test(line)) return `<span class="h2">${h}</span>`;
    if (/^> /.test(line)) return `<span class="q">${h}</span>`;
    return h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '[<span class="lk">$1</span>](<span class="q">$2</span>)');
  };
  let streamT = null;
  function runTerm(note) {
    term.hidden = false;
    term.innerHTML = `<div class="bar"><span class="dot g"></span><span class="dot"></span><span class="dot"></span><span class="t">${esc(RB.host)}</span><span class="sp"></span><button type="button" class="cp">${esc(C.copy)}</button><a href="${esc(C.llmsUrl)}" target="_blank" rel="noopener">${esc(C.openRaw)}</a></div><pre></pre>`;
    const pre = term.querySelector("pre"), lines = C.llms.trimEnd().split("\n");
    term.querySelector(".cp").addEventListener("click", e => { const b = e.currentTarget;
      (navigator.clipboard ? navigator.clipboard.writeText(C.llms) : Promise.reject()).then(() => { b.textContent = C.copied; setTimeout(() => b.textContent = C.copy, 1400); }).catch(() => {}); });
    const head = (note ? `<span class="q"># ${esc(note)}</span>\n` : "") + `<span class="p">$</span> `;
